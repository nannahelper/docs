<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR协议工作原理演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #1a56db;
            --primary-light: #e1effe;
            --success: #047857;
            --success-light: #d1fae5;
            --danger: #b91c1c;
            --danger-light: #fee2e2;
            --warning: #d97706;
            --warning-light: #fef3c7;
            --purple: #7c3aed;
            --purple-light: #ede9fe;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --border: #d1d5db;
            --bg-light: #f9fafb;
            --white: #ffffff;
        }
        
        body {
            font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--white);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
        }
        
        .page {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }
        
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-light);
        }
        
        .page-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }
        
        .page-title code {
            font-family: "Consolas", "Monaco", monospace;
            background: var(--primary-light);
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 13px;
            margin-left: 8px;
        }
        
        .page-badge {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--white);
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 3px;
        }
        
        .page-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }
        
        .side-panel {
            width: 280px;
            display: flex;
            flex-direction: column;
            background: var(--bg-light);
        }
        
        /* ===== 时序图区域 ===== */
        .visual-area {
            flex: 1;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }
        
        .timing-box {
            flex: 1;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 4px;
            position: relative;
            min-height: 320px;
        }
        
        /* 时间标注 */
        .time-arrow {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        /* 超时标记 */
        .timeout-mark {
            position: absolute;
            top: 22px;
            display: none;
            flex-direction: column;
            align-items: center;
        }
        
        .timeout-bar {
            height: 2px;
            background: var(--warning);
            position: relative;
        }
        
        .timeout-bar::before,
        .timeout-bar::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 8px;
            background: var(--warning);
        }
        
        .timeout-bar::before {
            left: 0;
            top: -3px;
        }
        
        .timeout-bar::after {
            right: 0;
            top: -3px;
        }
        
        .timeout-text {
            font-size: 10px;
            color: var(--warning);
            margin-top: 3px;
        }
        
        /* 发送方/接收方标签 */
        .party-label {
            position: absolute;
            left: 15px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
        }
        
        .sender-label {
            top: 50px;
        }
        
        .receiver-label {
            top: 260px;
        }
        
        /* 帧容器 */
        .frames-row {
            position: absolute;
            left: 65px;
            display: flex;
            gap: 2px;
        }
        
        .sender-frames {
            top: 42px;
        }
        
        .receiver-frames {
            top: 252px;
        }
        
        /* 帧格子 */
        .frame {
            width: 36px;
            height: 30px;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--border);
            background: var(--white);
            font-family: "Consolas", "Monaco", monospace;
            font-size: 14px;
            font-weight: 600;
        }
        
        .frame.visible {
            display: flex;
        }
        
        .frame.sent {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
        }
        
        .frame.acked {
            border-color: var(--success);
            background: var(--success-light);
            color: var(--success);
        }
        
        .frame.error {
            border-color: var(--danger);
            background: var(--danger-light);
            color: var(--danger);
        }
        
        .frame.buffered {
            border-color: var(--purple);
            background: var(--purple-light);
            color: var(--purple);
        }
        
        .frame.retransmit {
            border-color: var(--warning);
            background: var(--warning-light);
            color: var(--warning);
        }
        
        .frame.received {
            border-color: var(--success);
            background: var(--success-light);
            color: var(--success);
        }
        
        /* SVG箭头层 */
        .arrows-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .arrow-line {
            display: none;
            stroke-width: 1.5;
            fill: none;
        }
        
        .arrow-line.visible {
            display: block;
        }
        
        .arrow-line.data {
            stroke: var(--primary);
        }
        
        .arrow-line.data-error {
            stroke: var(--danger);
            stroke-dasharray: 4, 2;
        }
        
        .arrow-line.ack {
            stroke: var(--success);
            stroke-dasharray: 5, 3;
        }
        
        .arrow-line.nak {
            stroke: var(--danger);
            stroke-dasharray: 5, 3;
        }
        
        .arrow-label {
            display: none;
            font-family: "Consolas", "Monaco", monospace;
            font-size: 9px;
        }
        
        .arrow-label.visible {
            display: block;
        }
        
        .arrow-label.ack-label {
            fill: var(--success);
        }
        
        .arrow-label.nak-label {
            fill: var(--danger);
        }
        
        /* ===== 缓冲区可视化 ===== */
        .buffer-section {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 12px 15px;
        }
        
        .buffer-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .buffer-row:last-child {
            margin-bottom: 0;
        }
        
        .buffer-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            width: 80px;
            flex-shrink: 0;
        }
        
        .buffer-cells {
            display: flex;
            gap: 3px;
        }
        
        .buffer-cell {
            width: 28px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--border);
            background: var(--white);
            font-family: "Consolas", "Monaco", monospace;
            font-size: 11px;
            font-weight: 600;
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        
        .buffer-cell.empty {
            border-style: dashed;
            color: var(--text-secondary);
        }
        
        .buffer-cell.sent {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
        }
        
        .buffer-cell.acked {
            border-color: var(--success);
            background: var(--success-light);
            color: var(--success);
        }
        
        .buffer-cell.buffered {
            border-color: var(--purple);
            background: var(--purple-light);
            color: var(--purple);
        }
        
        .buffer-cell.waiting {
            border-color: var(--warning);
            background: var(--warning-light);
            color: var(--warning);
        }
        
        .buffer-cell.delivered {
            border-color: var(--success);
            background: var(--success-light);
            color: var(--success);
        }
        
        .window-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 10px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .window-bracket {
            display: flex;
            align-items: center;
        }
        
        .bracket-left, .bracket-right {
            width: 6px;
            height: 20px;
            border: 2px solid var(--primary);
        }
        
        .bracket-left {
            border-right: none;
            border-radius: 3px 0 0 3px;
        }
        
        .bracket-right {
            border-left: none;
            border-radius: 0 3px 3px 0;
        }
        
        .window-label {
            font-size: 10px;
            color: var(--primary);
            font-weight: 600;
        }
        
        /* ===== 控制面板 ===== */
        .control-area {
            border-top: 1px solid var(--border);
            padding: 10px 20px;
            background: var(--white);
        }
        
        .control-row {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
        }
        
        .control-left {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .control-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .scenario-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }
        
        .btn {
            padding: 5px 12px;
            border: 1px solid transparent;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-scenario {
            background: var(--white);
            color: var(--text-secondary);
            border-color: var(--border);
        }
        
        .btn-scenario:hover:not(:disabled) {
            background: var(--bg-light);
        }
        
        .btn-scenario.active {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }
        
        .btn-primary {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #1e40af;
        }
        
        .btn-success {
            background: var(--success);
            color: var(--white);
            border-color: var(--success);
        }
        
        .btn-success:hover:not(:disabled) {
            background: #065f46;
        }
        
        .btn-secondary {
            background: var(--white);
            color: var(--text-secondary);
            border-color: var(--border);
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-light);
        }
        
        .action-hint {
            font-size: 12px;
            color: var(--danger);
            font-weight: 600;
            animation: hintBlink 1s ease-in-out infinite;
        }
        
        @keyframes hintBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .speed-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .speed-group label {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .speed-group select {
            padding: 3px 6px;
            border: 1px solid var(--border);
            border-radius: 3px;
            font-size: 12px;
        }
        
        /* ===== 右侧面板 ===== */
        .side-header {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }
        
        .side-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .log-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .log-item {
            padding: 5px 8px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 3px;
            font-size: 11px;
            line-height: 1.4;
            color: var(--text-secondary);
        }
        
        .log-item.send { border-left: 3px solid var(--primary); }
        .log-item.ack { border-left: 3px solid var(--success); }
        .log-item.nak { border-left: 3px solid var(--danger); }
        .log-item.error { border-left: 3px solid var(--danger); }
        .log-item.buffer { border-left: 3px solid var(--purple); }
        .log-item.timeout { border-left: 3px solid var(--warning); }
        
        .log-item .log-time {
            font-family: "Consolas", "Monaco", monospace;
            color: var(--text-secondary);
            margin-right: 6px;
        }
        
        .log-item .log-text {
            color: var(--text);
        }
        
        /* 图例 */
        .legend-section {
            padding: 10px 12px;
            border-top: 1px solid var(--border);
            background: var(--white);
        }
        
        .legend-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }
        
        .legend-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: var(--text-secondary);
        }
        
        .legend-box {
            width: 20px;
            height: 14px;
            border: 1.5px solid;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Consolas", "Monaco", monospace;
            font-size: 9px;
            font-weight: 600;
        }
        
        .legend-box.sent { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
        .legend-box.acked { border-color: var(--success); background: var(--success-light); color: var(--success); }
        .legend-box.error { border-color: var(--danger); background: var(--danger-light); color: var(--danger); }
        .legend-box.buffered { border-color: var(--purple); background: var(--purple-light); color: var(--purple); }
        .legend-box.retransmit { border-color: var(--warning); background: var(--warning-light); color: var(--warning); }
        
        .info-section {
            padding: 10px 12px;
            border-top: 1px solid var(--border);
            background: var(--white);
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .info-section code {
            font-family: "Consolas", "Monaco", monospace;
            color: var(--primary);
            font-weight: 600;
        }
        
        .compare-section {
            padding: 10px 12px;
            border-top: 1px solid var(--border);
            background: var(--bg-light);
            font-size: 10px;
        }
        
        .compare-title {
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }
        
        .compare-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .compare-table th,
        .compare-table td {
            padding: 4px 6px;
            border: 1px solid var(--border);
            text-align: center;
        }
        
        .compare-table th {
            background: var(--white);
            font-weight: 600;
            color: var(--text);
        }
        
        .compare-table td {
            background: var(--white);
            color: var(--text-secondary);
        }
        
        .highlight-sr {
            color: var(--success) !important;
            font-weight: 600;
        }
        
        .highlight-gbn {
            color: var(--danger) !important;
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="page-header">
            <h1 class="page-title">SR协议工作原理<code>Selective Repeat</code></h1>
            <span class="page-badge">计算机网络 · 数据链路层</span>
        </header>
        
        <div class="page-body">
            <div class="main-panel">
                <div class="visual-area">
                    <!-- 时序图 -->
                    <div class="timing-box">
                        <div class="time-arrow">时间 →</div>
                        
                        <!-- 超时标记 -->
                        <div class="timeout-mark" id="timeoutMark">
                            <div class="timeout-bar" id="timeoutBar"></div>
                            <span class="timeout-text">超时</span>
                        </div>
                        
                        <!-- 发送方 -->
                        <div class="party-label sender-label">发送方</div>
                        <div class="frames-row sender-frames" id="senderFrames"></div>
                        
                        <!-- 接收方 -->
                        <div class="party-label receiver-label">接收方</div>
                        <div class="frames-row receiver-frames" id="receiverFrames"></div>
                        
                        <!-- SVG箭头层 -->
                        <svg class="arrows-svg" id="arrowsSvg">
                            <defs>
                                <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                                    <polygon points="0 0, 8 3, 0 6" fill="#1a56db"/>
                                </marker>
                                <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                                    <polygon points="0 0, 8 3, 0 6" fill="#047857"/>
                                </marker>
                                <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                                    <polygon points="0 0, 8 3, 0 6" fill="#b91c1c"/>
                                </marker>
                            </defs>
                        </svg>
                    </div>
                    
                    <!-- 缓冲区可视化 -->
                    <div class="buffer-section">
                        <div class="buffer-row">
                            <span class="buffer-label">发送窗口:</span>
                            <div class="buffer-cells" id="sendWindow"></div>
                            <div class="window-indicator">
                                <span class="window-label">W<sub>S</sub>=4</span>
                            </div>
                        </div>
                        <div class="buffer-row">
                            <span class="buffer-label">接收缓冲:</span>
                            <div class="buffer-cells" id="recvBuffer"></div>
                            <div class="window-indicator">
                                <span class="window-label">W<sub>R</sub>=4</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 控制面板 -->
                <div class="control-area">
                    <div class="control-row">
                        <div class="control-left">
                            <span class="scenario-label">场景:</span>
                            <button class="btn btn-scenario active" id="btnScene1">帧2出错</button>
                            <button class="btn btn-scenario" id="btnScene2">NAK机制</button>
                            <div class="speed-group">
                                <label>速度:</label>
                                <select id="speedSelect">
                                    <option value="1000">慢速</option>
                                    <option value="600" selected>正常</option>
                                    <option value="300">快速</option>
                                </select>
                            </div>
                        </div>
                        <div class="control-right">
                            <span class="action-hint" id="hintStart">请选择 ▶</span>
                            <button class="btn btn-primary" id="btnStart">开始演示</button>
                            <button class="btn btn-success" id="btnStep" disabled>单步</button>
                            <button class="btn btn-success" id="btnAuto" disabled>自动</button>
                            <button class="btn btn-secondary" id="btnReset">重置</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧面板 -->
            <div class="side-panel">
                <div class="side-header">执行日志</div>
                <div class="side-content">
                    <div class="log-list" id="logList"></div>
                </div>
                
                <div class="legend-section">
                    <div class="legend-title">图例说明</div>
                    <div class="legend-list">
                        <div class="legend-item">
                            <div class="legend-box sent">0</div>
                            <span>已发送待确认</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-box acked">0</div>
                            <span>已确认</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-box error">E</div>
                            <span>出错/丢失帧</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-box buffered">3</div>
                            <span>已缓存(乱序)</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-box retransmit">2</div>
                            <span>重传帧</span>
                        </div>
                    </div>
                </div>
                
                <div class="info-section">
                    <strong>SR核心特点：</strong><br>
                    1. 发送窗口 W<sub>S</sub> ≤ 2<sup>n-1</sup><br>
                    2. 接收窗口 W<sub>R</sub> = W<sub>S</sub><br>
                    3. 独立确认：ACK<sub>n</sub> 只确认帧n<br>
                    4. 选择性重传：<code>只重传出错帧</code>
                </div>
                
                <div class="compare-section">
                    <div class="compare-title">SR vs GBN 对比</div>
                    <table class="compare-table">
                        <tr>
                            <th></th>
                            <th>SR</th>
                            <th>GBN</th>
                        </tr>
                        <tr>
                            <td>接收窗口</td>
                            <td class="highlight-sr">>1</td>
                            <td class="highlight-gbn">=1</td>
                        </tr>
                        <tr>
                            <td>重传方式</td>
                            <td class="highlight-sr">仅出错帧</td>
                            <td class="highlight-gbn">回退N帧</td>
                        </tr>
                        <tr>
                            <td>缓冲区</td>
                            <td class="highlight-gbn">需要更大</td>
                            <td class="highlight-sr">较小</td>
                        </tr>
                        <tr>
                            <td>带宽利用</td>
                            <td class="highlight-sr">更高效</td>
                            <td class="highlight-gbn">浪费</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script>
(function() {
    // ===== 配置 =====
    var CONFIG = {
        frameWidth: 36,
        frameGap: 2,
        frameStartX: 65,
        senderY: 76,
        receiverY: 248,
        windowSize: 4,
        totalFrames: 8
    };
    
    // ===== 场景定义 =====
    var SCENARIOS = {
        scene1: {
            name: '帧2出错',
            description: 'SR协议：帧2出错，接收方缓存后续帧，只重传帧2',
            senderSeq: [0, 1, 2, 3, 4, 5, 6, 7, 2, 8, 9, 10, 11, 12, 10],
            receiverSeq: [0, 1, 'D', 3, 4, 5, 6, 7, 2, 8, 9, 'E', 11, 12, 10],
            errorFrames: [2, 10],
            useNak: true,
            timeout: { left: 140, width: 140 },
            deliverNote: { x: 320, text: '将分组2~7传给网络层' },
            steps: [
                { action: 'init', log: 'SR演示开始：帧2和帧10出错场景', logType: 'send' },
                { action: 'send', idx: 0, log: '发送帧0', logType: 'send' },
                { action: 'send', idx: 1, log: '发送帧1', logType: 'send' },
                { action: 'send', idx: 2, isError: true, log: '发送帧2（将丢失）', logType: 'error' },
                { action: 'send', idx: 3, log: '发送帧3', logType: 'send' },
                { action: 'send', idx: 4, log: '发送帧4', logType: 'send' },
                { action: 'send', idx: 5, log: '发送帧5', logType: 'send' },
                { action: 'send', idx: 6, log: '发送帧6', logType: 'send' },
                { action: 'send', idx: 7, log: '发送帧7', logType: 'send' },
                { action: 'receive', idx: 0, log: '接收帧0', logType: 'ack' },
                { action: 'ack', idx: 0, forFrame: 0, log: '返回ACK0', logType: 'ack' },
                { action: 'receive', idx: 1, log: '接收帧1', logType: 'ack' },
                { action: 'ack', idx: 1, forFrame: 1, log: '返回ACK1', logType: 'ack' },
                { action: 'lost', idx: 2, log: '帧2丢失！', logType: 'error' },
                { action: 'buffer', idx: 3, bufFrame: 3, log: '帧3缓存，发送ACK3', logType: 'buffer' },
                { action: 'ack', idx: 3, forFrame: 3, log: 'ACK3', logType: 'ack' },
                { action: 'buffer', idx: 4, bufFrame: 4, log: '帧4缓存', logType: 'buffer' },
                { action: 'ack', idx: 4, forFrame: 4, log: 'ACK4', logType: 'ack' },
                { action: 'buffer', idx: 5, bufFrame: 5, log: '帧5缓存', logType: 'buffer' },
                { action: 'ack', idx: 5, forFrame: 5, log: 'ACK5', logType: 'ack' },
                { action: 'buffer', idx: 6, bufFrame: 6, log: '帧6缓存', logType: 'buffer' },
                { action: 'ack', idx: 6, forFrame: 6, log: 'ACK6', logType: 'ack' },
                { action: 'buffer', idx: 7, bufFrame: 7, log: '帧7缓存', logType: 'buffer' },
                { action: 'ack', idx: 7, forFrame: 7, log: 'ACK7', logType: 'ack' },
                { action: 'timeout', log: '帧2超时！SR只重传帧2', logType: 'timeout' },
                { action: 'retransmit', idx: 8, retransmitFrame: 2, log: '重传帧2', logType: 'timeout' },
                { action: 'deliver', idx: 8, deliverRange: [2,7], log: '帧2到达，将分组2~7传给网络层', logType: 'ack' },
                { action: 'send', idx: 9, log: '发送帧8', logType: 'send' },
                { action: 'send', idx: 10, log: '发送帧9', logType: 'send' },
                { action: 'send', idx: 11, isError: true, log: '发送帧10（将出错）', logType: 'error' },
                { action: 'send', idx: 12, log: '发送帧11', logType: 'send' },
                { action: 'send', idx: 13, log: '发送帧12', logType: 'send' },
                { action: 'receive', idx: 9, log: '接收帧8', logType: 'ack' },
                { action: 'ack', idx: 9, forFrame: 8, log: 'ACK8', logType: 'ack' },
                { action: 'receive', idx: 10, log: '接收帧9', logType: 'ack' },
                { action: 'ack', idx: 10, forFrame: 9, log: 'ACK9', logType: 'ack' },
                { action: 'error', idx: 11, log: '帧10出错！', logType: 'error' },
                { action: 'nak', idx: 11, nakFrame: 10, log: '发送NAK10', logType: 'nak' },
                { action: 'buffer', idx: 12, bufFrame: 11, log: '帧11缓存', logType: 'buffer' },
                { action: 'ack', idx: 12, forFrame: 11, log: 'ACK11', logType: 'ack' },
                { action: 'buffer', idx: 13, bufFrame: 12, log: '帧12缓存', logType: 'buffer' },
                { action: 'ack', idx: 13, forFrame: 12, log: 'ACK12', logType: 'ack' },
                { action: 'retransmit', idx: 14, retransmitFrame: 10, log: '收到NAK10，重传帧10', logType: 'timeout' },
                { action: 'deliver2', idx: 14, log: '帧10到达，分组10~12交付', logType: 'ack' },
                { action: 'complete', log: 'SR演示完成：只重传出错帧', logType: 'ack' }
            ]
        },
        scene2: {
            name: 'NAK机制',
            description: 'SR协议：展示NAK快速重传机制',
            senderSeq: [0, 1, 2, 3, 4, 2, 5, 6],
            receiverSeq: [0, 1, 'D', 3, 4, 2, 5, 6],
            errorFrames: [2],
            useNak: true,
            timeout: { left: 140, width: 100 },
            steps: [
                { action: 'init', log: 'SR演示：NAK快速重传', logType: 'send' },
                { action: 'send', idx: 0, log: '发送帧0', logType: 'send' },
                { action: 'send', idx: 1, log: '发送帧1', logType: 'send' },
                { action: 'send', idx: 2, isError: true, log: '发送帧2（将丢失）', logType: 'error' },
                { action: 'send', idx: 3, log: '发送帧3', logType: 'send' },
                { action: 'send', idx: 4, log: '发送帧4', logType: 'send' },
                { action: 'receive', idx: 0, log: '接收帧0', logType: 'ack' },
                { action: 'ack', idx: 0, forFrame: 0, log: '返回ACK0', logType: 'ack' },
                { action: 'receive', idx: 1, log: '接收帧1', logType: 'ack' },
                { action: 'ack', idx: 1, forFrame: 1, log: '返回ACK1', logType: 'ack' },
                { action: 'lost', idx: 2, log: '帧2丢失！', logType: 'error' },
                { action: 'buffer', idx: 3, bufFrame: 3, log: '帧3到达但期望帧2，缓存', logType: 'buffer' },
                { action: 'nak', idx: 3, nakFrame: 2, log: '发送NAK2请求重传', logType: 'nak' },
                { action: 'ack', idx: 3, forFrame: 3, log: '同时发送ACK3', logType: 'ack' },
                { action: 'buffer', idx: 4, bufFrame: 4, log: '帧4缓存', logType: 'buffer' },
                { action: 'ack', idx: 4, forFrame: 4, log: 'ACK4', logType: 'ack' },
                { action: 'retransmit', idx: 5, retransmitFrame: 2, log: '收到NAK2，立即重传帧2', logType: 'timeout' },
                { action: 'deliver', idx: 5, deliverRange: [2,4], log: '帧2到达，分组2~4交付网络层', logType: 'ack' },
                { action: 'send', idx: 6, log: '发送帧5', logType: 'send' },
                { action: 'send', idx: 7, log: '发送帧6', logType: 'send' },
                { action: 'receive', idx: 6, log: '接收帧5', logType: 'ack' },
                { action: 'ack', idx: 6, forFrame: 5, log: 'ACK5', logType: 'ack' },
                { action: 'receive', idx: 7, log: '接收帧6', logType: 'ack' },
                { action: 'ack', idx: 7, forFrame: 6, log: 'ACK6', logType: 'ack' },
                { action: 'complete', log: 'NAK快速重传完成！', logType: 'ack' }
            ]
        }
    };
    
    // ===== 状态 =====
    var state = {
        currentScene: 'scene1',
        phase: 'idle',
        stepIndex: 0,
        speed: 600,
        autoMode: false,
        logCount: 0,
        senderFrames: [],
        receiverFrames: [],
        arrows: [],
        labels: [],
        sendWindowState: [],
        recvBufferState: []
    };
    
    // ===== DOM引用 =====
    var logList = document.getElementById('logList');
    var timeoutMark = document.getElementById('timeoutMark');
    var timeoutBar = document.getElementById('timeoutBar');
    var senderFramesEl = document.getElementById('senderFrames');
    var receiverFramesEl = document.getElementById('receiverFrames');
    var arrowsSvg = document.getElementById('arrowsSvg');
    var sendWindowEl = document.getElementById('sendWindow');
    var recvBufferEl = document.getElementById('recvBuffer');
    var btnScene1 = document.getElementById('btnScene1');
    var btnScene2 = document.getElementById('btnScene2');
    var btnStart = document.getElementById('btnStart');
    var btnStep = document.getElementById('btnStep');
    var btnAuto = document.getElementById('btnAuto');
    var btnReset = document.getElementById('btnReset');
    var hintStart = document.getElementById('hintStart');
    var speedSelect = document.getElementById('speedSelect');
    
    // ===== 初始化帧元素 =====
    function initFrames() {
        var scene = SCENARIOS[state.currentScene];
        
        // 清空
        senderFramesEl.innerHTML = '';
        receiverFramesEl.innerHTML = '';
        state.senderFrames = [];
        state.receiverFrames = [];
        
        // 创建发送方帧
        for (var i = 0; i < scene.senderSeq.length; i++) {
            var frame = document.createElement('div');
            frame.className = 'frame';
            frame.textContent = scene.senderSeq[i];
            senderFramesEl.appendChild(frame);
            state.senderFrames.push(frame);
        }
        
        // 创建接收方帧
        for (var i = 0; i < scene.receiverSeq.length; i++) {
            var frame = document.createElement('div');
            frame.className = 'frame';
            frame.textContent = scene.receiverSeq[i];
            receiverFramesEl.appendChild(frame);
            state.receiverFrames.push(frame);
        }
    }
    
    // ===== 初始化箭头 =====
    function initArrows() {
        // 移除旧箭头（保留defs）
        var oldArrows = arrowsSvg.querySelectorAll('line, text');
        for (var i = 0; i < oldArrows.length; i++) {
            oldArrows[i].remove();
        }
        state.arrows = [];
        state.labels = [];
        
        var scene = SCENARIOS[state.currentScene];
        
        // 为每个帧创建箭头和标签
        for (var i = 0; i < scene.senderSeq.length; i++) {
            var x = CONFIG.frameStartX + (CONFIG.frameWidth + CONFIG.frameGap) * i + CONFIG.frameWidth / 2;
            
            // 数据箭头（发送方→接收方）
            var dataArrow = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            dataArrow.setAttribute('x1', x);
            dataArrow.setAttribute('y1', CONFIG.senderY);
            dataArrow.setAttribute('x2', x);
            dataArrow.setAttribute('y2', CONFIG.receiverY);
            dataArrow.setAttribute('class', 'arrow-line data');
            dataArrow.setAttribute('marker-end', 'url(#arrowBlue)');
            arrowsSvg.appendChild(dataArrow);
            state.arrows.push({ type: 'data', el: dataArrow, idx: i });
            
            // ACK箭头（接收方→发送方，斜向右上）
            var ackArrow = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            ackArrow.setAttribute('x1', x + 10);
            ackArrow.setAttribute('y1', CONFIG.receiverY);
            ackArrow.setAttribute('x2', x + 30);
            ackArrow.setAttribute('y2', CONFIG.senderY);
            ackArrow.setAttribute('class', 'arrow-line ack');
            ackArrow.setAttribute('marker-end', 'url(#arrowGreen)');
            arrowsSvg.appendChild(ackArrow);
            state.arrows.push({ type: 'ack', el: ackArrow, idx: i });
            
            // ACK标签
            var ackLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            ackLabel.setAttribute('x', x + 28);
            ackLabel.setAttribute('y', 165);
            ackLabel.setAttribute('class', 'arrow-label ack-label');
            ackLabel.textContent = 'ACK' + scene.senderSeq[i];
            arrowsSvg.appendChild(ackLabel);
            state.labels.push({ type: 'ack', el: ackLabel, idx: i });
        }
    }
    
    // ===== 初始化缓冲区显示 =====
    function initBufferDisplay() {
        sendWindowEl.innerHTML = '';
        recvBufferEl.innerHTML = '';
        state.sendWindowState = [];
        state.recvBufferState = [];
        
        var bufferSize = 13; // 0-12
        
        for (var i = 0; i < bufferSize; i++) {
            // 发送窗口
            var sendCell = document.createElement('div');
            sendCell.className = 'buffer-cell empty';
            sendCell.textContent = i;
            sendWindowEl.appendChild(sendCell);
            state.sendWindowState.push({ el: sendCell, state: 'empty' });
            
            // 接收缓冲
            var recvCell = document.createElement('div');
            recvCell.className = 'buffer-cell empty';
            recvCell.textContent = i;
            recvBufferEl.appendChild(recvCell);
            state.recvBufferState.push({ el: recvCell, state: 'empty' });
        }
    }
    
    // ===== 更新发送窗口显示 =====
    function updateSendWindow(frameNum, newState) {
        if (frameNum >= 0 && frameNum < state.sendWindowState.length) {
            var cell = state.sendWindowState[frameNum];
            cell.el.className = 'buffer-cell ' + newState;
            cell.state = newState;
        }
    }
    
    // ===== 更新接收缓冲显示 =====
    function updateRecvBuffer(frameNum, newState) {
        if (frameNum >= 0 && frameNum < state.recvBufferState.length) {
            var cell = state.recvBufferState[frameNum];
            cell.el.className = 'buffer-cell ' + newState;
            cell.state = newState;
        }
    }
    
    // ===== 显示帧 =====
    function showSenderFrame(idx, cls) {
        if (state.senderFrames[idx]) {
            state.senderFrames[idx].classList.add('visible');
            if (cls) {
                state.senderFrames[idx].classList.remove('sent', 'acked', 'error', 'retransmit');
                state.senderFrames[idx].classList.add(cls);
            }
        }
    }
    
    function showReceiverFrame(idx, cls) {
        if (state.receiverFrames[idx]) {
            state.receiverFrames[idx].classList.add('visible');
            if (cls) {
                state.receiverFrames[idx].classList.remove('received', 'error', 'buffered');
                state.receiverFrames[idx].classList.add(cls);
            }
        }
    }
    
    // ===== 显示箭头 =====
    function showDataArrow(idx, isError) {
        for (var i = 0; i < state.arrows.length; i++) {
            if (state.arrows[i].type === 'data' && state.arrows[i].idx === idx) {
                var arrow = state.arrows[i].el;
                arrow.classList.add('visible');
                if (isError) {
                    arrow.classList.remove('data');
                    arrow.classList.add('data-error');
                    arrow.setAttribute('marker-end', 'url(#arrowRed)');
                }
                break;
            }
        }
    }
    
    function showAckArrow(idx) {
        for (var i = 0; i < state.arrows.length; i++) {
            if (state.arrows[i].type === 'ack' && state.arrows[i].idx === idx) {
                state.arrows[i].el.classList.add('visible');
                break;
            }
        }
        for (var i = 0; i < state.labels.length; i++) {
            if (state.labels[i].type === 'ack' && state.labels[i].idx === idx) {
                state.labels[i].el.classList.add('visible');
                break;
            }
        }
    }
    
    // ===== 添加NAK箭头 =====
    function showNakArrow(idx, nakFrame) {
        var scene = SCENARIOS[state.currentScene];
        var x = CONFIG.frameStartX + (CONFIG.frameWidth + CONFIG.frameGap) * idx + CONFIG.frameWidth / 2;
        
        // NAK箭头
        var nakArrow = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        nakArrow.setAttribute('x1', x - 5);
        nakArrow.setAttribute('y1', CONFIG.receiverY);
        nakArrow.setAttribute('x2', x + 15);
        nakArrow.setAttribute('y2', CONFIG.senderY);
        nakArrow.setAttribute('class', 'arrow-line nak visible');
        nakArrow.setAttribute('marker-end', 'url(#arrowRed)');
        arrowsSvg.appendChild(nakArrow);
        
        // NAK标签
        var nakLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        nakLabel.setAttribute('x', x + 5);
        nakLabel.setAttribute('y', 145);
        nakLabel.setAttribute('class', 'arrow-label nak-label visible');
        nakLabel.textContent = 'NAK' + nakFrame;
        arrowsSvg.appendChild(nakLabel);
    }
    
    // ===== 更新ACK标签 =====
    function updateAckLabel(idx, text) {
        for (var i = 0; i < state.labels.length; i++) {
            if (state.labels[i].type === 'ack' && state.labels[i].idx === idx) {
                state.labels[i].el.textContent = text;
                break;
            }
        }
    }
    
    // ===== 显示超时标记 =====
    function showTimeout() {
        var scene = SCENARIOS[state.currentScene];
        timeoutMark.style.left = scene.timeout.left + 'px';
        timeoutBar.style.width = scene.timeout.width + 'px';
        timeoutMark.style.display = 'flex';
    }
    
    // ===== 添加日志 =====
    function addLog(text, type) {
        state.logCount++;
        var item = document.createElement('div');
        item.className = 'log-item ' + (type || '');
        
        var timeSpan = document.createElement('span');
        timeSpan.className = 'log-time';
        timeSpan.textContent = '[' + state.logCount + ']';
        
        var textSpan = document.createElement('span');
        textSpan.className = 'log-text';
        textSpan.textContent = text;
        
        item.appendChild(timeSpan);
        item.appendChild(textSpan);
        logList.insertBefore(item, logList.firstChild);
    }
    
    // ===== 执行步骤 =====
    function executeStep() {
        var scene = SCENARIOS[state.currentScene];
        if (state.stepIndex >= scene.steps.length) {
            state.phase = 'complete';
            updateUI();
            return;
        }
        
        var step = scene.steps[state.stepIndex];
        var frameNum = typeof scene.senderSeq[step.idx] === 'number' ? scene.senderSeq[step.idx] : step.retransmitFrame;
        
        switch (step.action) {
            case 'init':
                // 初始化
                break;
                
            case 'send':
                showSenderFrame(step.idx, step.isError ? 'error' : 'sent');
                if (typeof frameNum === 'number') {
                    updateSendWindow(frameNum, 'sent');
                }
                break;
                
            case 'receive':
                showReceiverFrame(step.idx, 'received');
                showDataArrow(step.idx, false);
                var recvFrameNum = scene.senderSeq[step.idx];
                if (typeof recvFrameNum === 'number') {
                    updateRecvBuffer(recvFrameNum, 'delivered');
                }
                break;
                
            case 'ack':
                showAckArrow(step.idx);
                updateAckLabel(step.idx, 'ACK' + step.forFrame);
                updateSendWindow(step.forFrame, 'acked');
                break;
                
            case 'error':
                showReceiverFrame(step.idx, 'error');
                showDataArrow(step.idx, true);
                var errorFrameNum = scene.senderSeq[step.idx];
                if (typeof errorFrameNum === 'number') {
                    updateRecvBuffer(errorFrameNum, 'waiting');
                }
                break;
                
            case 'lost':
                showDataArrow(step.idx, true);
                // 帧丢失，显示接收方帧为D(丢弃)
                showReceiverFrame(step.idx, 'error');
                var lostFrameNum = scene.senderSeq[step.idx];
                if (typeof lostFrameNum === 'number') {
                    updateRecvBuffer(lostFrameNum, 'waiting');
                }
                break;
                
            case 'buffer':
                showReceiverFrame(step.idx, 'buffered');
                showDataArrow(step.idx, false);
                updateRecvBuffer(step.bufFrame, 'buffered');
                break;
                
            case 'nak':
                showNakArrow(step.idx, step.nakFrame);
                break;
                
            case 'timeout':
                showTimeout();
                break;
                
            case 'retransmit':
                showSenderFrame(step.idx, 'retransmit');
                updateSendWindow(step.retransmitFrame, 'sent');
                break;
                
            case 'deliver':
                showReceiverFrame(step.idx, 'received');
                showDataArrow(step.idx, false);
                // 交付指定范围的缓冲区帧
                if (step.deliverRange) {
                    for (var i = step.deliverRange[0]; i <= step.deliverRange[1]; i++) {
                        updateRecvBuffer(i, 'delivered');
                    }
                }
                // 更新发送方确认
                updateSendWindow(step.retransmitFrame || 2, 'acked');
                // 显示最终ACK
                showAckArrow(step.idx);
                updateAckLabel(step.idx, 'ACK' + (step.retransmitFrame || 2));
                break;
                
            case 'deliver2':
                showReceiverFrame(step.idx, 'received');
                showDataArrow(step.idx, false);
                // 交付帧10-12
                for (var i = 10; i <= 12; i++) {
                    if (state.recvBufferState[i]) {
                        updateRecvBuffer(i, 'delivered');
                    }
                }
                // 更新发送方确认
                updateSendWindow(10, 'acked');
                // 显示最终ACK
                showAckArrow(step.idx);
                updateAckLabel(step.idx, 'ACK10');
                break;
                
            case 'complete':
                // 完成
                break;
        }
        
        addLog(step.log, step.logType);
        state.stepIndex++;
        updateUI();
    }
    
    // ===== UI更新 =====
    function updateUI() {
        btnStart.disabled = state.phase !== 'idle';
        btnStep.disabled = state.phase !== 'running';
        btnAuto.disabled = state.phase !== 'running' || state.autoMode;
        btnScene1.disabled = state.phase !== 'idle';
        btnScene2.disabled = state.phase !== 'idle';
        
        hintStart.style.display = state.phase === 'idle' ? 'inline' : 'none';
    }
    
    // ===== 重置 =====
    function resetDemo() {
        state.phase = 'idle';
        state.stepIndex = 0;
        state.autoMode = false;
        state.logCount = 0;
        
        logList.innerHTML = '';
        timeoutMark.style.display = 'none';
        
        initFrames();
        initArrows();
        initBufferDisplay();
        updateUI();
    }
    
    // ===== 场景切换 =====
    function selectScene(sceneId) {
        state.currentScene = sceneId;
        btnScene1.classList.toggle('active', sceneId === 'scene1');
        btnScene2.classList.toggle('active', sceneId === 'scene2');
        resetDemo();
    }
    
    // ===== 开始演示 =====
    function startDemo() {
        state.phase = 'running';
        state.stepIndex = 0;
        state.logCount = 0;
        logList.innerHTML = '';
        timeoutMark.style.display = 'none';
        
        initFrames();
        initArrows();
        initBufferDisplay();
        updateUI();
    }
    
    // ===== 单步执行 =====
    function stepExecute() {
        if (state.phase !== 'running') return;
        executeStep();
    }
    
    // ===== 自动执行 =====
    function autoExecute() {
        if (state.phase !== 'running') return;
        
        state.autoMode = true;
        state.speed = parseInt(speedSelect.value) || 600;
        updateUI();
        
        function runNext() {
            var scene = SCENARIOS[state.currentScene];
            if (state.stepIndex >= scene.steps.length || !state.autoMode) {
                state.autoMode = false;
                updateUI();
                return;
            }
            
            executeStep();
            setTimeout(runNext, state.speed);
        }
        
        runNext();
    }
    
    // ===== 事件绑定 =====
    btnScene1.onclick = function() { selectScene('scene1'); };
    btnScene2.onclick = function() { selectScene('scene2'); };
    btnStart.onclick = startDemo;
    btnStep.onclick = stepExecute;
    btnAuto.onclick = autoExecute;
    btnReset.onclick = resetDemo;
    
    // ===== 初始化 =====
    initFrames();
    initArrows();
    initBufferDisplay();
    updateUI();
})();
</script>
</body>
</html>
