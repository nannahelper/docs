<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集线器带宽分配与冲突演示</title>
    <style>
        /* ===== 408教学风格基础样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            /* 主色调：学术蓝 */
            --primary: #1a56db;
            --primary-light: #e1effe;
            /* 功能色 */
            --success: #047857;
            --success-light: #d1fae5;
            --danger: #b91c1c;
            --danger-light: #fee2e2;
            --warning: #d97706;
            --warning-light: #fef3c7;
            /* 中性色 */
            --text: #1f2937;
            --text-secondary: #6b7280;
            --border: #d1d5db;
            --bg-light: #f9fafb;
            --white: #ffffff;
        }
        
        body {
            font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--white);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
        }
        
        /* ===== 页面布局 ===== */
        .page {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }
        
        /* 顶部标题栏 */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-light);
        }
        
        .page-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }
        
        .page-title code {
            font-family: "Consolas", "Monaco", monospace;
            background: var(--primary-light);
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 13px;
            margin-left: 8px;
        }
        
        .page-badge {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--white);
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 3px;
        }
        
        /* 主体区域 */
        .page-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        /* 左侧主区域 */
        .main-panel {
            flex: 0 0 78%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }
        
        /* 右侧消息区域 */
        .side-panel {
            flex: 0 0 22%;
            display: flex;
            flex-direction: column;
            background: var(--bg-light);
        }
        
        /* ===== 可视化区域 ===== */
        .visual-area {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .visual-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        
        .visual-label {
            font-family: "Consolas", "Monaco", monospace;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }
        
        .visual-info {
            font-family: "Consolas", "Monaco", monospace;
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .visual-info strong {
            color: var(--primary);
        }
        
        .bandwidth-display {
            display: flex;
            gap: 16px;
            align-items: center;
            padding: 6px 12px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 3px;
        }
        
        .bandwidth-item {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .bandwidth-item span {
            font-weight: 600;
            color: var(--primary);
        }
        
        .bandwidth-item.warning span {
            color: var(--warning);
        }
        
        .bandwidth-item.danger span {
            color: var(--danger);
        }
        
        /* 拓扑容器 */
        .topology-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 4px;
            position: relative;
            min-height: 400px;
        }
        
        .topology-svg {
            width: 100%;
            height: 100%;
        }
        
        /* ===== 控制区域 ===== */
        .control-area {
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            background: var(--white);
        }
        
        .control-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        
        .control-left {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            align-items: center;
        }
        
        .control-right {
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .control-label {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        
        .control-input input[type="number"] {
            width: 60px;
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 3px;
            font-family: "Consolas", "Monaco", monospace;
            font-size: 13px;
            text-align: center;
        }
        
        .control-input input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        /* PC选择器 */
        .pc-selector {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        
        .pc-checkbox {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 3px 8px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        
        .pc-checkbox:hover {
            border-color: var(--primary);
        }
        
        .pc-checkbox.selected {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .pc-checkbox input {
            display: none;
        }
        
        /* 按钮样式 */
        .btn {
            padding: 6px 16px;
            border: 1px solid transparent;
            border-radius: 3px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #1e40af;
        }
        
        .btn-success {
            background: var(--success);
            color: var(--white);
        }
        
        .btn-success:hover:not(:disabled) {
            background: #065f46;
        }
        
        .btn-danger {
            background: var(--danger);
            color: var(--white);
        }
        
        .btn-danger:hover:not(:disabled) {
            background: #991b1b;
        }
        
        .btn-secondary {
            background: var(--white);
            color: var(--text-secondary);
            border-color: var(--border);
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-light);
        }
        
        .action-hint {
            font-size: 12px;
            color: var(--danger);
            font-weight: 600;
            animation: hintBlink 1s ease-in-out infinite;
            margin-right: 4px;
        }
        
        @keyframes hintBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* ===== 右侧面板 ===== */
        .side-header {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            background: var(--white);
        }
        
        .side-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        /* 说明区域 */
        .info-section {
            margin-bottom: 12px;
        }
        
        .info-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .info-box {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 8px 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .info-box ul {
            margin: 0;
            padding-left: 16px;
        }
        
        .info-box li {
            margin: 4px 0;
        }
        
        .info-box .highlight {
            color: var(--primary);
            font-weight: 500;
        }
        
        .info-box .danger {
            color: var(--danger);
            font-weight: 500;
        }
        
        /* 步骤列表 */
        .step-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px 10px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 3px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .step-item.active {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
        }
        
        .step-item.done {
            border-color: var(--success);
            color: var(--success);
        }
        
        .step-item.collision {
            border-color: var(--danger);
            background: var(--danger-light);
            color: var(--danger);
        }
        
        .step-num {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--border);
            color: var(--white);
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .step-item.active .step-num { background: var(--primary); }
        .step-item.done .step-num { background: var(--success); }
        .step-item.collision .step-num { background: var(--danger); }
        
        /* ===== SVG样式 ===== */
        .hub-body {
            fill: #e5e7eb;
            stroke: #374151;
            stroke-width: 2;
        }
        
        .hub-label {
            font-family: "Consolas", "Monaco", monospace;
            font-size: 14px;
            font-weight: 600;
            fill: #374151;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        
        .pc-body {
            fill: var(--white);
            stroke: #374151;
            stroke-width: 1.5;
        }
        
        .pc-body.sending {
            fill: var(--primary-light);
            stroke: var(--primary);
            stroke-width: 2;
        }
        
        .pc-body.collision {
            fill: var(--danger-light);
            stroke: var(--danger);
            stroke-width: 2;
        }
        
        .pc-label {
            font-family: "Consolas", "Monaco", monospace;
            font-size: 11px;
            fill: #374151;
            text-anchor: middle;
        }
        
        .pc-bandwidth {
            font-family: "Consolas", "Monaco", monospace;
            font-size: 10px;
            fill: var(--text-secondary);
            text-anchor: middle;
        }
        
        .link-line {
            stroke: #9ca3af;
            stroke-width: 2;
        }
        
        .link-line.active {
            stroke: var(--primary);
            stroke-width: 3;
        }
        
        .link-line.collision {
            stroke: var(--danger);
            stroke-width: 3;
        }
        
        /* 数据包样式 */
        .packet {
            fill: var(--primary);
        }
        
        .packet.collision {
            fill: var(--danger);
        }
        
        /* 冲突标记 */
        .collision-mark {
            fill: none;
            stroke: var(--danger);
            stroke-width: 3;
        }
        
        .collision-text {
            font-family: system-ui, sans-serif;
            font-size: 12px;
            font-weight: 600;
            fill: var(--danger);
            text-anchor: middle;
        }
        
        /* 状态指示器 */
        .status-indicator {
            padding: 8px 12px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 3px;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .status-indicator.idle {
            border-color: var(--border);
            color: var(--text-secondary);
        }
        
        .status-indicator.sending {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
        }
        
        .status-indicator.collision {
            border-color: var(--danger);
            background: var(--danger-light);
            color: var(--danger);
        }
        
        .status-indicator.success {
            border-color: var(--success);
            background: var(--success-light);
            color: var(--success);
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- 标题栏 -->
        <header class="page-header">
            <h1 class="page-title">集线器带宽分配与冲突演示<code>Hub</code></h1>
            <span class="page-badge">计算机网络 · 物理层</span>
        </header>
        
        <!-- 主体 -->
        <div class="page-body">
            <!-- 左侧主面板 -->
            <div class="main-panel">
                <!-- 可视化区域 -->
                <div class="visual-area">
                    <div class="visual-header">
                        <span class="visual-label">星型拓扑网络</span>
                        <div class="bandwidth-display">
                            <div class="bandwidth-item">
                                总带宽: <span id="totalBandwidth">100</span> Mbps
                            </div>
                            <div class="bandwidth-item" id="perPcBandwidth">
                                每台PC: <span>50</span> Mbps
                            </div>
                            <div class="bandwidth-item">
                                连接设备: <span id="pcCount">2</span> 台
                            </div>
                        </div>
                    </div>
                    
                    <div class="topology-container">
                        <svg class="topology-svg" id="topologySvg" viewBox="0 0 700 450">
                            <defs>
                                <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                                    <polygon points="0 0, 8 3, 0 6" fill="#1a56db"/>
                                </marker>
                            </defs>
                            <g id="linksGroup"></g>
                            <g id="packetsGroup"></g>
                            <g id="hubGroup"></g>
                            <g id="pcsGroup"></g>
                            <g id="collisionGroup"></g>
                        </svg>
                    </div>
                </div>
                
                <!-- 控制区域 -->
                <div class="control-area">
                    <div class="control-row">
                        <div class="control-left">
                            <div class="control-group">
                                <span class="control-label">PC数量</span>
                                <div class="control-input">
                                    <input type="number" id="inputPcCount" value="4" min="2" max="8">
                                </div>
                            </div>
                            <div class="control-group">
                                <span class="control-label">总带宽(Mbps)</span>
                                <div class="control-input">
                                    <input type="number" id="inputBandwidth" value="100" min="10" max="1000" step="10">
                                </div>
                            </div>
                            <div class="control-group">
                                <span class="control-label">发送PC</span>
                                <div class="pc-selector" id="pcSelector"></div>
                            </div>
                        </div>
                        <div class="control-right">
                            <span class="action-hint" id="hintApply">请选择 ▶</span>
                            <button class="btn btn-secondary" id="btnApply">应用配置</button>
                            <span class="action-hint" id="hintSend" style="display:none;">请选择 ▶</span>
                            <button class="btn btn-primary" id="btnSend">发送数据</button>
                            <button class="btn btn-secondary" id="btnReset">重置</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧面板 -->
            <div class="side-panel">
                <div class="side-header">演示说明</div>
                <div class="side-content">
                    <!-- 状态指示器 -->
                    <div class="status-indicator idle" id="statusIndicator">
                        空闲状态
                    </div>
                    
                    <!-- 集线器特性 -->
                    <div class="info-section">
                        <div class="info-title">集线器特性</div>
                        <div class="info-box">
                            <ul>
                                <li><span class="highlight">共享带宽</span>：所有端口共享总带宽</li>
                                <li><span class="highlight">广播转发</span>：收到数据向所有端口转发</li>
                                <li><span class="danger">半双工</span>：同一时刻只能单向传输</li>
                                <li><span class="danger">冲突域</span>：所有端口在同一冲突域</li>
                            </ul>
                        </div>
                    </div>
                    
                    <!-- 操作步骤 -->
                    <div class="info-section">
                        <div class="info-title">当前操作</div>
                        <div class="step-list" id="stepList">
                            <div class="step-item active" id="step1">
                                <span class="step-num">1</span>
                                <span>设置PC数量和带宽</span>
                            </div>
                            <div class="step-item" id="step2">
                                <span class="step-num">2</span>
                                <span>选择发送数据的PC</span>
                            </div>
                            <div class="step-item" id="step3">
                                <span class="step-num">3</span>
                                <span>观察数据传输/冲突</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 结果说明 -->
                    <div class="info-section">
                        <div class="info-title">传输结果</div>
                        <div class="info-box" id="resultBox">
                            选择要发送数据的PC，点击"发送数据"观察效果。
                            <br><br>
                            <strong>提示</strong>：选择多台PC同时发送将产生冲突！
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
    (function() {
        // ===== 配置常量 =====
        var CONFIG = {
            centerX: 350,
            centerY: 225,
            hubRadius: 45,
            pcRadius: 100,
            pcWidth: 70,
            pcHeight: 50,
            totalBandwidth: 100,
            animationDuration: 800
        };
        
        // ===== 状态 =====
        var state = {
            pcCount: 4,
            totalBandwidth: 100,
            selectedPcs: [],
            isAnimating: false,
            phase: 'idle' // idle, sending, collision, success
        };
        
        // ===== DOM 引用 =====
        var topologySvg = document.getElementById('topologySvg');
        var linksGroup = document.getElementById('linksGroup');
        var packetsGroup = document.getElementById('packetsGroup');
        var hubGroup = document.getElementById('hubGroup');
        var pcsGroup = document.getElementById('pcsGroup');
        var collisionGroup = document.getElementById('collisionGroup');
        var pcSelector = document.getElementById('pcSelector');
        var statusIndicator = document.getElementById('statusIndicator');
        var resultBox = document.getElementById('resultBox');
        
        var inputPcCount = document.getElementById('inputPcCount');
        var inputBandwidth = document.getElementById('inputBandwidth');
        var btnApply = document.getElementById('btnApply');
        var btnSend = document.getElementById('btnSend');
        var btnReset = document.getElementById('btnReset');
        
        var totalBandwidthEl = document.getElementById('totalBandwidth');
        var perPcBandwidthEl = document.getElementById('perPcBandwidth');
        var pcCountEl = document.getElementById('pcCount');
        
        var hintApply = document.getElementById('hintApply');
        var hintSend = document.getElementById('hintSend');
        
        // ===== 工具函数 =====
        function getPcPosition(index, total) {
            var angle = (2 * Math.PI * index / total) - Math.PI / 2;
            var radius = 150;
            return {
                x: CONFIG.centerX + radius * Math.cos(angle),
                y: CONFIG.centerY + radius * Math.sin(angle)
            };
        }
        
        function createSvgElement(tag) {
            return document.createElementNS('http://www.w3.org/2000/svg', tag);
        }
        
        function calculatePerPcBandwidth() {
            return Math.round(state.totalBandwidth / state.pcCount * 10) / 10;
        }
        
        // ===== 渲染函数 =====
        function renderTopology() {
            // 清空
            linksGroup.innerHTML = '';
            hubGroup.innerHTML = '';
            pcsGroup.innerHTML = '';
            packetsGroup.innerHTML = '';
            collisionGroup.innerHTML = '';
            
            // 绘制连接线
            for (var i = 0; i < state.pcCount; i++) {
                var pos = getPcPosition(i, state.pcCount);
                var line = createSvgElement('line');
                line.setAttribute('class', 'link-line');
                line.setAttribute('id', 'link-' + i);
                line.setAttribute('x1', CONFIG.centerX);
                line.setAttribute('y1', CONFIG.centerY);
                line.setAttribute('x2', pos.x);
                line.setAttribute('y2', pos.y);
                linksGroup.appendChild(line);
            }
            
            // 绘制集线器
            var hubRect = createSvgElement('rect');
            hubRect.setAttribute('class', 'hub-body');
            hubRect.setAttribute('x', CONFIG.centerX - CONFIG.hubRadius);
            hubRect.setAttribute('y', CONFIG.centerY - CONFIG.hubRadius * 0.6);
            hubRect.setAttribute('width', CONFIG.hubRadius * 2);
            hubRect.setAttribute('height', CONFIG.hubRadius * 1.2);
            hubRect.setAttribute('rx', '4');
            hubGroup.appendChild(hubRect);
            
            var hubLabel = createSvgElement('text');
            hubLabel.setAttribute('class', 'hub-label');
            hubLabel.setAttribute('x', CONFIG.centerX);
            hubLabel.setAttribute('y', CONFIG.centerY);
            hubLabel.textContent = 'HUB';
            hubGroup.appendChild(hubLabel);
            
            // 绘制PC
            var perBandwidth = calculatePerPcBandwidth();
            for (var i = 0; i < state.pcCount; i++) {
                var pos = getPcPosition(i, state.pcCount);
                var g = createSvgElement('g');
                g.setAttribute('id', 'pc-' + i);
                
                // PC主体
                var rect = createSvgElement('rect');
                rect.setAttribute('class', 'pc-body');
                rect.setAttribute('id', 'pc-body-' + i);
                rect.setAttribute('x', pos.x - CONFIG.pcWidth / 2);
                rect.setAttribute('y', pos.y - CONFIG.pcHeight / 2);
                rect.setAttribute('width', CONFIG.pcWidth);
                rect.setAttribute('height', CONFIG.pcHeight);
                rect.setAttribute('rx', '3');
                g.appendChild(rect);
                
                // PC标签
                var label = createSvgElement('text');
                label.setAttribute('class', 'pc-label');
                label.setAttribute('x', pos.x);
                label.setAttribute('y', pos.y - 5);
                label.textContent = 'PC' + (i + 1);
                g.appendChild(label);
                
                // 带宽标签
                var bwLabel = createSvgElement('text');
                bwLabel.setAttribute('class', 'pc-bandwidth');
                bwLabel.setAttribute('id', 'pc-bw-' + i);
                bwLabel.setAttribute('x', pos.x);
                bwLabel.setAttribute('y', pos.y + 12);
                bwLabel.textContent = perBandwidth + ' Mbps';
                g.appendChild(bwLabel);
                
                pcsGroup.appendChild(g);
            }
            
            // 更新带宽显示
            updateBandwidthDisplay();
        }
        
        function renderPcSelector() {
            pcSelector.innerHTML = '';
            state.selectedPcs = [];
            
            for (var i = 0; i < state.pcCount; i++) {
                var label = document.createElement('label');
                label.className = 'pc-checkbox';
                label.setAttribute('data-index', i);
                
                var input = document.createElement('input');
                input.type = 'checkbox';
                input.value = i;
                
                var span = document.createElement('span');
                span.textContent = 'PC' + (i + 1);
                
                label.appendChild(input);
                label.appendChild(span);
                
                label.onclick = function(e) {
                    if (state.isAnimating) return;
                    var idx = parseInt(this.getAttribute('data-index'));
                    var checkbox = this.querySelector('input');
                    checkbox.checked = !checkbox.checked;
                    
                    if (checkbox.checked) {
                        this.classList.add('selected');
                        if (state.selectedPcs.indexOf(idx) === -1) {
                            state.selectedPcs.push(idx);
                        }
                    } else {
                        this.classList.remove('selected');
                        var pos = state.selectedPcs.indexOf(idx);
                        if (pos !== -1) {
                            state.selectedPcs.splice(pos, 1);
                        }
                    }
                    
                    updateHint();
                    e.preventDefault();
                };
                
                pcSelector.appendChild(label);
            }
        }
        
        function updateBandwidthDisplay() {
            var perBandwidth = calculatePerPcBandwidth();
            totalBandwidthEl.textContent = state.totalBandwidth;
            pcCountEl.textContent = state.pcCount;
            
            var perPcSpan = perPcBandwidthEl.querySelector('span');
            perPcSpan.textContent = perBandwidth;
            
            // 根据带宽设置颜色
            perPcBandwidthEl.className = 'bandwidth-item';
            if (perBandwidth < 20) {
                perPcBandwidthEl.classList.add('danger');
            } else if (perBandwidth < 50) {
                perPcBandwidthEl.classList.add('warning');
            }
        }
        
        function updateHint() {
            hintApply.style.display = 'none';
            hintSend.style.display = 'none';
            
            if (state.phase === 'idle') {
                if (state.selectedPcs.length > 0) {
                    hintSend.style.display = 'inline';
                } else {
                    hintApply.style.display = 'inline';
                }
            }
        }
        
        function updateStatus(status, message) {
            statusIndicator.className = 'status-indicator ' + status;
            statusIndicator.textContent = message;
        }
        
        function updateSteps(activeStep) {
            var steps = ['step1', 'step2', 'step3'];
            for (var i = 0; i < steps.length; i++) {
                var el = document.getElementById(steps[i]);
                el.className = 'step-item';
                if (i + 1 === activeStep) {
                    el.classList.add('active');
                } else if (i + 1 < activeStep) {
                    el.classList.add('done');
                }
            }
        }
        
        // ===== 动画函数 =====
        function animateSend() {
            if (state.selectedPcs.length === 0) {
                resultBox.innerHTML = '<span class="danger">请选择至少一台PC发送数据！</span>';
                return;
            }
            
            state.isAnimating = true;
            state.phase = 'sending';
            btnSend.disabled = true;
            btnApply.disabled = true;
            
            var hasCollision = state.selectedPcs.length > 1;
            
            // 高亮发送的PC和连接线
            for (var i = 0; i < state.selectedPcs.length; i++) {
                var idx = state.selectedPcs[i];
                var pcBody = document.getElementById('pc-body-' + idx);
                var link = document.getElementById('link-' + idx);
                pcBody.setAttribute('class', 'pc-body sending');
                link.setAttribute('class', 'link-line active');
            }
            
            updateStatus('sending', '数据发送中...');
            updateSteps(3);
            
            // 创建数据包动画
            var packets = [];
            for (var i = 0; i < state.selectedPcs.length; i++) {
                var idx = state.selectedPcs[i];
                var pos = getPcPosition(idx, state.pcCount);
                
                var packet = createSvgElement('circle');
                packet.setAttribute('class', 'packet');
                packet.setAttribute('r', '8');
                packet.setAttribute('cx', pos.x);
                packet.setAttribute('cy', pos.y);
                packetsGroup.appendChild(packet);
                packets.push({
                    element: packet,
                    startX: pos.x,
                    startY: pos.y,
                    endX: CONFIG.centerX,
                    endY: CONFIG.centerY
                });
            }
            
            // 动画：数据包向Hub移动
            var startTime = null;
            var duration = CONFIG.animationDuration;
            
            function animatePackets(timestamp) {
                if (!startTime) startTime = timestamp;
                var progress = (timestamp - startTime) / duration;
                
                if (progress >= 1) {
                    progress = 1;
                }
                
                for (var i = 0; i < packets.length; i++) {
                    var p = packets[i];
                    var x = p.startX + (p.endX - p.startX) * progress;
                    var y = p.startY + (p.endY - p.startY) * progress;
                    p.element.setAttribute('cx', x);
                    p.element.setAttribute('cy', y);
                }
                
                if (progress < 1) {
                    requestAnimationFrame(animatePackets);
                } else {
                    // 到达Hub
                    if (hasCollision) {
                        showCollision(packets);
                    } else {
                        showSuccess(packets);
                    }
                }
            }
            
            requestAnimationFrame(animatePackets);
        }
        
        function showCollision(packets) {
            state.phase = 'collision';
            
            // 修改数据包和连接线样式
            for (var i = 0; i < packets.length; i++) {
                packets[i].element.setAttribute('class', 'packet collision');
            }
            
            for (var i = 0; i < state.selectedPcs.length; i++) {
                var idx = state.selectedPcs[i];
                var pcBody = document.getElementById('pc-body-' + idx);
                var link = document.getElementById('link-' + idx);
                pcBody.setAttribute('class', 'pc-body collision');
                link.setAttribute('class', 'link-line collision');
            }
            
            // 显示冲突标记
            var collisionMark = createSvgElement('g');
            
            // X标记
            var line1 = createSvgElement('line');
            line1.setAttribute('class', 'collision-mark');
            line1.setAttribute('x1', CONFIG.centerX - 25);
            line1.setAttribute('y1', CONFIG.centerY - 25);
            line1.setAttribute('x2', CONFIG.centerX + 25);
            line1.setAttribute('y2', CONFIG.centerY + 25);
            
            var line2 = createSvgElement('line');
            line2.setAttribute('class', 'collision-mark');
            line2.setAttribute('x1', CONFIG.centerX + 25);
            line2.setAttribute('y1', CONFIG.centerY - 25);
            line2.setAttribute('x2', CONFIG.centerX - 25);
            line2.setAttribute('y2', CONFIG.centerY + 25);
            
            var text = createSvgElement('text');
            text.setAttribute('class', 'collision-text');
            text.setAttribute('x', CONFIG.centerX);
            text.setAttribute('y', CONFIG.centerY + 55);
            text.textContent = '冲突！数据丢失';
            
            collisionMark.appendChild(line1);
            collisionMark.appendChild(line2);
            collisionMark.appendChild(text);
            collisionGroup.appendChild(collisionMark);
            
            updateStatus('collision', '发生冲突！');
            
            var step3 = document.getElementById('step3');
            step3.className = 'step-item collision';
            
            // 更新结果说明
            resultBox.innerHTML = '<span class="danger">冲突发生！</span><br><br>' +
                state.selectedPcs.length + '台PC同时发送数据，在集线器处产生冲突。<br><br>' +
                '<strong>原因</strong>：集线器所有端口共享同一冲突域，无法同时接收多路数据。<br><br>' +
                '<strong>后果</strong>：所有数据帧均失效，需要等待随机退避后重传。';
            
            setTimeout(function() {
                state.isAnimating = false;
                btnSend.disabled = false;
                btnApply.disabled = false;
                updateHint();
            }, 1500);
        }
        
        function showSuccess(packets) {
            state.phase = 'success';
            
            var senderIdx = state.selectedPcs[0];
            
            updateStatus('success', '传输成功！');
            
            // 动画：数据包从Hub向其他PC转发
            var targetPcs = [];
            for (var i = 0; i < state.pcCount; i++) {
                if (i !== senderIdx) {
                    targetPcs.push(i);
                    var link = document.getElementById('link-' + i);
                    link.setAttribute('class', 'link-line active');
                }
            }
            
            // 创建转发的数据包
            var forwardPackets = [];
            for (var i = 0; i < targetPcs.length; i++) {
                var idx = targetPcs[i];
                var pos = getPcPosition(idx, state.pcCount);
                
                var packet = createSvgElement('circle');
                packet.setAttribute('class', 'packet');
                packet.setAttribute('r', '6');
                packet.setAttribute('cx', CONFIG.centerX);
                packet.setAttribute('cy', CONFIG.centerY);
                packetsGroup.appendChild(packet);
                forwardPackets.push({
                    element: packet,
                    startX: CONFIG.centerX,
                    startY: CONFIG.centerY,
                    endX: pos.x,
                    endY: pos.y
                });
            }
            
            // 隐藏原始数据包
            packets[0].element.style.display = 'none';
            
            // 动画：转发
            var startTime = null;
            var duration = CONFIG.animationDuration;
            
            function animateForward(timestamp) {
                if (!startTime) startTime = timestamp;
                var progress = (timestamp - startTime) / duration;
                
                if (progress >= 1) progress = 1;
                
                for (var i = 0; i < forwardPackets.length; i++) {
                    var p = forwardPackets[i];
                    var x = p.startX + (p.endX - p.startX) * progress;
                    var y = p.startY + (p.endY - p.startY) * progress;
                    p.element.setAttribute('cx', x);
                    p.element.setAttribute('cy', y);
                }
                
                if (progress < 1) {
                    requestAnimationFrame(animateForward);
                } else {
                    finishSuccess();
                }
            }
            
            requestAnimationFrame(animateForward);
            
            function finishSuccess() {
                var step3 = document.getElementById('step3');
                step3.className = 'step-item done';
                
                var perBandwidth = calculatePerPcBandwidth();
                resultBox.innerHTML = '<span class="highlight">传输成功！</span><br><br>' +
                    'PC' + (senderIdx + 1) + ' 发送的数据被集线器广播到所有其他端口。<br><br>' +
                    '<strong>实际效率</strong>：每台PC平均可用带宽为 ' + perBandwidth + ' Mbps（总带宽/' + state.pcCount + '台设备）<br><br>' +
                    '<strong>注意</strong>：即使只有一台PC发送，其他PC也无法同时发送（半双工）。';
                
                setTimeout(function() {
                    state.isAnimating = false;
                    btnSend.disabled = false;
                    btnApply.disabled = false;
                    updateHint();
                }, 500);
            }
        }
        
        function reset() {
            state.isAnimating = false;
            state.phase = 'idle';
            state.selectedPcs = [];
            
            // 重置视觉状态
            packetsGroup.innerHTML = '';
            collisionGroup.innerHTML = '';
            
            for (var i = 0; i < state.pcCount; i++) {
                var pcBody = document.getElementById('pc-body-' + i);
                var link = document.getElementById('link-' + i);
                if (pcBody) pcBody.setAttribute('class', 'pc-body');
                if (link) link.setAttribute('class', 'link-line');
            }
            
            // 重置选择器
            var checkboxes = pcSelector.querySelectorAll('.pc-checkbox');
            for (var i = 0; i < checkboxes.length; i++) {
                checkboxes[i].classList.remove('selected');
                checkboxes[i].querySelector('input').checked = false;
            }
            
            // 重置状态显示
            updateStatus('idle', '空闲状态');
            updateSteps(1);
            resultBox.innerHTML = '选择要发送数据的PC，点击"发送数据"观察效果。<br><br><strong>提示</strong>：选择多台PC同时发送将产生冲突！';
            
            btnSend.disabled = false;
            btnApply.disabled = false;
            updateHint();
        }
        
        function applyConfig() {
            var newPcCount = parseInt(inputPcCount.value);
            var newBandwidth = parseInt(inputBandwidth.value);
            
            if (newPcCount < 2) newPcCount = 2;
            if (newPcCount > 8) newPcCount = 8;
            if (newBandwidth < 10) newBandwidth = 10;
            if (newBandwidth > 1000) newBandwidth = 1000;
            
            inputPcCount.value = newPcCount;
            inputBandwidth.value = newBandwidth;
            
            state.pcCount = newPcCount;
            state.totalBandwidth = newBandwidth;
            
            renderTopology();
            renderPcSelector();
            reset();
            
            updateSteps(2);
        }
        
        // ===== 事件绑定 =====
        btnApply.onclick = applyConfig;
        btnSend.onclick = animateSend;
        btnReset.onclick = reset;
        
        inputPcCount.onchange = function() {
            updateHint();
        };
        
        inputBandwidth.onchange = function() {
            updateHint();
        };
        
        // ===== 初始化 =====
        function init() {
            renderTopology();
            renderPcSelector();
            updateHint();
        }
        
        init();
    })();
    </script>
</body>
</html>
