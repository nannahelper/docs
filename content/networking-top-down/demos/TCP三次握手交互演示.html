<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCP三次握手过程演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #1a56db;
            --primary-light: #e1effe;
            --success: #047857;
            --success-light: #d1fae5;
            --danger: #b91c1c;
            --danger-light: #fee2e2;
            --warning: #d97706;
            --warning-light: #fef3c7;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --border: #d1d5db;
            --bg-light: #f9fafb;
            --white: #ffffff;
        }
        
        body {
            font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--white);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
        }
        
        .page {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1300px;
            margin: 0 auto;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }
        
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-light);
        }
        
        .page-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }
        
        .page-title code {
            font-family: "Consolas", "Monaco", monospace;
            background: var(--primary-light);
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 13px;
            margin-left: 8px;
        }
        
        .page-badge {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--white);
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 3px;
        }
        
        .page-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }
        
        .side-panel {
            width: 280px;
            display: flex;
            flex-direction: column;
            background: var(--bg-light);
        }
        
        /* ===== 时序图区域 ===== */
        .visual-area {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .timing-box {
            flex: 1;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 4px;
            position: relative;
            min-height: 480px;
        }
        
        /* 时间箭头 */
        .time-arrow {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            writing-mode: vertical-lr;
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        /* 主机标签 */
        .host-label {
            position: absolute;
            top: 15px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            text-align: center;
        }
        
        .host-label .host-name {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 400;
            display: block;
        }
        
        .client-label {
            left: 100px;
        }
        
        .server-label {
            right: 100px;
        }
        
        /* 状态时间线 */
        .timeline {
            position: absolute;
            top: 55px;
            width: 2px;
            height: 420px;
            background: var(--text);
        }
        
        .client-timeline {
            left: 130px;
        }
        
        .server-timeline {
            right: 130px;
        }
        
        /* 状态框 */
        .state-box {
            position: absolute;
            width: 90px;
            height: 40px;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--text);
            background: var(--white);
            font-size: 12px;
            font-weight: 600;
            border-radius: 0;
        }
        
        .state-box.visible {
            display: flex;
        }
        
        .state-box.active {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
        }
        
        .state-box.established {
            border-color: var(--success);
            background: var(--success-light);
            color: var(--success);
        }
        
        .state-box.done {
            border-color: var(--border);
            background: #f3f4f6;
            color: var(--text-secondary);
        }
        
        /* 客户端状态位置 */
        .client-state {
            left: 85px;
        }
        
        .server-state {
            right: 85px;
        }
        
        /* 动作标签 */
        .action-label {
            position: absolute;
            font-size: 11px;
            color: var(--text-secondary);
            display: none;
        }
        
        .action-label.visible {
            display: block;
        }
        
        /* SVG箭头层 */
        .arrows-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .arrow-line {
            display: none;
            stroke-width: 1.5;
            fill: none;
        }
        
        .arrow-line.visible {
            display: block;
        }
        
        .arrow-line.data {
            stroke: var(--primary);
        }
        
        .arrow-line.ack {
            stroke: var(--success);
        }
        
        .arrow-line.syn-ack {
            stroke: var(--warning);
        }
        
        /* 报文标签 */
        .msg-label {
            font-family: "Consolas", "Monaco", monospace;
            font-size: 11px;
            font-weight: 600;
            display: none;
        }
        
        .msg-label.visible {
            display: block;
        }
        
        .msg-label.syn {
            fill: var(--primary);
        }
        
        .msg-label.syn-ack {
            fill: var(--warning);
        }
        
        .msg-label.ack {
            fill: var(--success);
        }
        
        /* 数据传送标记 */
        .data-transfer {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 16px;
            border: 2px solid var(--success);
            background: var(--success-light);
            color: var(--success);
            font-weight: 600;
            font-size: 13px;
            border-radius: 3px;
            display: none;
        }
        
        .data-transfer.visible {
            display: block;
        }
        
        /* ===== 控制面板 ===== */
        .control-area {
            border-top: 1px solid var(--border);
            padding: 12px 20px;
            background: var(--white);
        }
        
        .control-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        
        .control-left {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            align-items: center;
        }
        
        .control-right {
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        
        .scenario-label {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .speed-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .speed-group select {
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 3px;
            font-size: 12px;
        }
        
        .btn {
            padding: 6px 16px;
            border: 1px solid transparent;
            border-radius: 3px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #1e40af;
        }
        
        .btn-success {
            background: var(--success);
            color: var(--white);
        }
        
        .btn-success:hover:not(:disabled) {
            background: #065f46;
        }
        
        .btn-secondary {
            background: var(--white);
            color: var(--text-secondary);
            border-color: var(--border);
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-light);
        }
        
        .action-hint {
            font-size: 12px;
            color: var(--danger);
            font-weight: 600;
            animation: hintBlink 1s ease-in-out infinite;
        }
        
        @keyframes hintBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* ===== 右侧面板 ===== */
        .side-header {
            padding: 10px 12px;
            font-weight: 600;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            background: var(--white);
        }
        
        .side-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .log-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .log-item {
            padding: 8px 10px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 3px;
            font-size: 12px;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }
        
        .log-item.syn {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        
        .log-item.syn-ack {
            border-color: var(--warning);
            background: var(--warning-light);
        }
        
        .log-item.ack {
            border-color: var(--success);
            background: var(--success-light);
        }
        
        .log-item.state {
            border-color: var(--text-secondary);
            background: #f3f4f6;
        }
        
        .log-num {
            min-width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--border);
            color: var(--white);
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .log-item.syn .log-num { background: var(--primary); }
        .log-item.syn-ack .log-num { background: var(--warning); }
        .log-item.ack .log-num { background: var(--success); }
        .log-item.state .log-num { background: var(--text-secondary); }
        
        .log-text {
            flex: 1;
            line-height: 1.4;
        }
        
        .log-text code {
            font-family: "Consolas", "Monaco", monospace;
            font-weight: 600;
        }
        
        /* 图例 */
        .legend-section {
            padding: 10px 12px;
            border-top: 1px solid var(--border);
            background: var(--white);
        }
        
        .legend-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .legend-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .legend-line {
            width: 30px;
            height: 2px;
        }
        
        .legend-line.syn {
            background: var(--primary);
        }
        
        .legend-line.syn-ack {
            background: var(--warning);
        }
        
        .legend-line.ack {
            background: var(--success);
        }
        
        /* 信息区 */
        .info-section {
            padding: 10px 12px;
            border-top: 1px solid var(--border);
            background: var(--white);
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        
        .info-section strong {
            color: var(--text);
        }
        
        .info-section code {
            font-family: "Consolas", "Monaco", monospace;
            color: var(--primary);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="page-header">
            <h1 class="page-title">TCP三次握手<code>Three-Way Handshake</code></h1>
            <span class="page-badge">计算机网络 · 传输层</span>
        </header>
        
        <div class="page-body">
            <div class="main-panel">
                <div class="visual-area">
                    <div class="timing-box">
                        <!-- 时间箭头 -->
                        <div class="time-arrow">时间 ↓</div>
                        
                        <!-- 客户机标签 -->
                        <div class="host-label client-label">
                            客户机
                            <span class="host-name">A</span>
                        </div>
                        
                        <!-- 服务器标签 -->
                        <div class="host-label server-label">
                            服务器
                            <span class="host-name">B</span>
                        </div>
                        
                        <!-- 时间线 -->
                        <div class="timeline client-timeline"></div>
                        <div class="timeline server-timeline"></div>
                        
                        <!-- 客户端状态框 -->
                        <div class="state-box client-state" id="c-closed" style="top: 50px;">CLOSED</div>
                        <div class="state-box client-state" id="c-syn-sent" style="top: 130px;">SYN-SENT</div>
                        <div class="state-box client-state" id="c-established" style="top: 330px;">ESTABLISHED</div>
                        
                        <!-- 服务器状态框 -->
                        <div class="state-box server-state" id="s-closed" style="top: 50px;">CLOSED</div>
                        <div class="state-box server-state" id="s-listen" style="top: 100px;">LISTEN</div>
                        <div class="state-box server-state" id="s-syn-rcvd" style="top: 210px;">SYN-RCVD</div>
                        <div class="state-box server-state" id="s-established" style="top: 395px;">ESTABLISHED</div>
                        
                        <!-- 动作标签 -->
                        <div class="action-label" id="act-active" style="left: 20px; top: 140px;">主动打开</div>
                        <div class="action-label" id="act-passive" style="right: 20px; top: 108px;">被动打开</div>
                        
                        <!-- SVG箭头层 -->
                        <svg class="arrows-svg">
                            <defs>
                                <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                                    <polygon points="0 0, 8 3, 0 6" fill="#1a56db"/>
                                </marker>
                                <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                                    <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
                                </marker>
                                <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                                    <polygon points="0 0, 8 3, 0 6" fill="#047857"/>
                                </marker>
                            </defs>
                            
                            <!-- 第一次握手：SYN (从SYN-SENT底部→SYN-RCVD顶部) -->
                            <line class="arrow-line data" id="arrow1" x1="175" y1="170" x2="712" y2="210" marker-end="url(#arrowBlue)"/>
                            <text class="msg-label syn" id="msg1-1" x="400" y="172" font-style="italic">SYN=1, seq=x</text>
                            
                            <!-- 第二次握手：SYN+ACK (从SYN-RCVD底部→ESTABLISHED顶部) -->
                            <line class="arrow-line syn-ack" id="arrow2" x1="712" y1="250" x2="175" y2="330" marker-end="url(#arrowOrange)"/>
                            <text class="msg-label syn-ack" id="msg2-1" x="350" y="270" font-style="italic">SYN=1, ACK=1, seq=y, ack=x+1</text>
                            
                            <!-- 第三次握手：ACK (从ESTABLISHED底部→服务器ESTABLISHED顶部) -->
                            <line class="arrow-line ack" id="arrow3" x1="175" y1="370" x2="712" y2="395" marker-end="url(#arrowGreen)"/>
                            <text class="msg-label ack" id="msg3-1" x="400" y="368" font-style="italic">ACK=1, seq=x+1, ack=y+1</text>
                        </svg>
                        
                        <!-- 数据传送标记 -->
                        <div class="data-transfer" id="dataTransfer">数据传送</div>
                    </div>
                </div>
                
                <!-- 控制面板 -->
                <div class="control-area">
                    <div class="control-row">
                        <div class="control-left">
                            <div class="speed-group">
                                <label>速度:</label>
                                <select id="speedSelect">
                                    <option value="1500">慢速</option>
                                    <option value="900" selected>正常</option>
                                    <option value="500">快速</option>
                                </select>
                            </div>
                        </div>
                        <div class="control-right">
                            <span class="action-hint" id="hintStart">请选择 ▶</span>
                            <button class="btn btn-primary" id="btnStart">开始演示</button>
                            <button class="btn btn-success" id="btnStep" disabled>单步执行</button>
                            <button class="btn btn-success" id="btnAuto" disabled>自动演示</button>
                            <button class="btn btn-secondary" id="btnReset">重置</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧面板 -->
            <div class="side-panel">
                <div class="side-header">握手过程详解</div>
                <div class="side-content">
                    <div class="log-list" id="logList"></div>
                </div>
                
                <div class="legend-section">
                    <div class="legend-title">报文类型</div>
                    <div class="legend-list">
                        <div class="legend-item">
                            <div class="legend-line syn"></div>
                            <span>SYN 连接请求</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-line syn-ack"></div>
                            <span>SYN+ACK 确认并请求</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-line ack"></div>
                            <span>ACK 确认</span>
                        </div>
                    </div>
                </div>
                
                <div class="info-section">
                    <strong>三次握手目的：</strong><br>
                    1. 确认双方的发送和接收能力<br>
                    2. 同步初始序列号 <code>seq</code><br>
                    3. 协商连接参数（MSS等）<br>
                    4. 防止已失效的连接请求报文
                </div>
            </div>
        </div>
    </div>

<script>
(function() {
    // ===== 步骤配置 =====
    var STEPS = [
        // 初始状态
        {
            states: { 'c-closed': 'active', 's-closed': 'active' },
            actions: [],
            arrows: [],
            log: '初始状态：客户机和服务器都处于 CLOSED 状态',
            logType: 'state'
        },
        // 服务器被动打开
        {
            states: { 'c-closed': 'active', 's-closed': 'done', 's-listen': 'active' },
            actions: ['act-passive'],
            arrows: [],
            log: '服务器执行被动打开（passive open），进入 LISTEN 状态，等待客户机连接',
            logType: 'state'
        },
        // 客户机主动打开，发送SYN
        {
            states: { 'c-closed': 'done', 'c-syn-sent': 'active', 's-closed': 'done', 's-listen': 'active' },
            actions: ['act-passive', 'act-active'],
            arrows: [],
            log: '客户机执行主动打开（active open），准备发起连接请求',
            logType: 'state'
        },
        // 第一次握手
        {
            states: { 'c-closed': 'done', 'c-syn-sent': 'active', 's-closed': 'done', 's-listen': 'active' },
            actions: ['act-passive', 'act-active'],
            arrows: ['arrow1', 'msg1-1'],
            log: '【第一次握手】客户机发送连接请求：<code>SYN=1, seq=x</code>，进入 SYN-SENT 状态',
            logType: 'syn'
        },
        // 第二次握手
        {
            states: { 'c-closed': 'done', 'c-syn-sent': 'active', 's-closed': 'done', 's-listen': 'done', 's-syn-rcvd': 'active' },
            actions: ['act-passive', 'act-active'],
            arrows: ['arrow1', 'msg1-1', 'arrow2', 'msg2-1'],
            log: '【第二次握手】服务器收到SYN，发送确认：<code>SYN=1, ACK=1, seq=y, ack=x+1</code>，进入 SYN-RCVD 状态',
            logType: 'syn-ack'
        },
        // 第三次握手
        {
            states: { 'c-closed': 'done', 'c-syn-sent': 'done', 'c-established': 'established', 's-closed': 'done', 's-listen': 'done', 's-syn-rcvd': 'active' },
            actions: ['act-passive', 'act-active'],
            arrows: ['arrow1', 'msg1-1', 'arrow2', 'msg2-1', 'arrow3', 'msg3-1'],
            log: '【第三次握手】客户机收到SYN+ACK，发送确认：<code>ACK=1, seq=x+1, ack=y+1</code>，进入 ESTABLISHED 状态',
            logType: 'ack'
        },
        // 连接建立完成
        {
            states: { 'c-closed': 'done', 'c-syn-sent': 'done', 'c-established': 'established', 's-closed': 'done', 's-listen': 'done', 's-syn-rcvd': 'done', 's-established': 'established' },
            actions: ['act-passive', 'act-active'],
            arrows: ['arrow1', 'msg1-1', 'arrow2', 'msg2-1', 'arrow3', 'msg3-1'],
            showDataTransfer: true,
            log: '服务器收到ACK，进入 ESTABLISHED 状态，TCP连接建立成功，可以开始数据传送！',
            logType: 'ack'
        }
    ];
    
    // ===== 状态 =====
    var state = {
        phase: 'idle',
        stepIndex: 0,
        speed: 900,
        autoMode: false,
        logCount: 0
    };
    
    // ===== DOM引用 =====
    var logList = document.getElementById('logList');
    var btnStart = document.getElementById('btnStart');
    var btnStep = document.getElementById('btnStep');
    var btnAuto = document.getElementById('btnAuto');
    var btnReset = document.getElementById('btnReset');
    var hintStart = document.getElementById('hintStart');
    var speedSelect = document.getElementById('speedSelect');
    var dataTransfer = document.getElementById('dataTransfer');
    
    // 所有状态框
    var stateBoxes = ['c-closed', 'c-syn-sent', 'c-established', 's-closed', 's-listen', 's-syn-rcvd', 's-established'];
    // 所有动作标签
    var actionLabels = ['act-active', 'act-passive'];
    // 所有箭头和标签
    var arrowElements = ['arrow1', 'arrow2', 'arrow3', 'msg1-1', 'msg2-1', 'msg3-1'];
    
    // ===== 工具函数 =====
    function showElement(id) {
        var el = document.getElementById(id);
        if (el) el.classList.add('visible');
    }
    
    function hideElement(id) {
        var el = document.getElementById(id);
        if (el) el.classList.remove('visible', 'active', 'established', 'done');
    }
    
    function setStateBox(id, stateClass) {
        var el = document.getElementById(id);
        if (!el) return;
        el.classList.remove('active', 'established', 'done');
        if (stateClass) {
            el.classList.add('visible', stateClass);
        } else {
            el.classList.remove('visible');
        }
    }
    
    function hideAll() {
        // 隐藏所有状态框
        for (var i = 0; i < stateBoxes.length; i++) {
            hideElement(stateBoxes[i]);
        }
        // 隐藏所有动作标签
        for (var i = 0; i < actionLabels.length; i++) {
            hideElement(actionLabels[i]);
        }
        // 隐藏所有箭头
        for (var i = 0; i < arrowElements.length; i++) {
            hideElement(arrowElements[i]);
        }
        // 隐藏数据传送标记
        dataTransfer.classList.remove('visible');
    }
    
    function addLog(text, type) {
        state.logCount++;
        var item = document.createElement('div');
        item.className = 'log-item ' + (type || '');
        item.innerHTML = '<span class="log-num">' + state.logCount + '</span>' +
                         '<span class="log-text">' + text + '</span>';
        
        if (logList.firstChild) {
            logList.insertBefore(item, logList.firstChild);
        } else {
            logList.appendChild(item);
        }
        logList.scrollTop = 0;
    }
    
    function clearLogs() {
        logList.innerHTML = '';
        state.logCount = 0;
    }
    
    function updateUI() {
        var isIdle = state.phase === 'idle';
        var isRunning = state.phase === 'running';
        var isComplete = state.phase === 'complete';
        
        btnStart.disabled = isRunning;
        btnStep.disabled = !isRunning;
        btnAuto.disabled = !isRunning || state.autoMode;
        
        // 更新提示
        if (isIdle) {
            hintStart.style.display = 'inline';
            hintStart.textContent = '请选择 ▶';
        } else if (isRunning && !state.autoMode) {
            hintStart.style.display = 'inline';
            hintStart.textContent = '请点击 ▶';
        } else {
            hintStart.style.display = 'none';
        }
    }
    
    // ===== 执行步骤 =====
    function executeStep() {
        if (state.stepIndex >= STEPS.length) {
            state.phase = 'complete';
            state.autoMode = false;
            updateUI();
            return;
        }
        
        var step = STEPS[state.stepIndex];
        
        // 更新状态框
        for (var id in step.states) {
            setStateBox(id, step.states[id]);
        }
        
        // 更新动作标签
        for (var i = 0; i < actionLabels.length; i++) {
            var actId = actionLabels[i];
            if (step.actions.indexOf(actId) >= 0) {
                showElement(actId);
            } else {
                hideElement(actId);
            }
        }
        
        // 更新箭头
        for (var i = 0; i < arrowElements.length; i++) {
            var arrId = arrowElements[i];
            if (step.arrows.indexOf(arrId) >= 0) {
                showElement(arrId);
            } else {
                hideElement(arrId);
            }
        }
        
        // 数据传送标记
        if (step.showDataTransfer) {
            dataTransfer.classList.add('visible');
        } else {
            dataTransfer.classList.remove('visible');
        }
        
        // 添加日志
        addLog(step.log, step.logType);
        
        state.stepIndex++;
        updateUI();
    }
    
    // ===== 控制函数 =====
    function startDemo() {
        state.phase = 'running';
        state.stepIndex = 0;
        state.autoMode = false;
        hideAll();
        clearLogs();
        updateUI();
        // 自动执行第一步
        executeStep();
    }
    
    function stepExecute() {
        if (state.phase !== 'running') return;
        executeStep();
    }
    
    function autoExecute() {
        if (state.phase !== 'running') return;
        state.autoMode = true;
        updateUI();
        
        function runNext() {
            if (state.stepIndex >= STEPS.length || !state.autoMode) {
                state.autoMode = false;
                if (state.stepIndex >= STEPS.length) {
                    state.phase = 'complete';
                }
                updateUI();
                return;
            }
            executeStep();
            setTimeout(runNext, state.speed);
        }
        runNext();
    }
    
    function resetDemo() {
        state.phase = 'idle';
        state.stepIndex = 0;
        state.autoMode = false;
        hideAll();
        clearLogs();
        updateUI();
    }
    
    // ===== 事件绑定 =====
    btnStart.onclick = startDemo;
    btnStep.onclick = stepExecute;
    btnAuto.onclick = autoExecute;
    btnReset.onclick = resetDemo;
    
    speedSelect.onchange = function() {
        state.speed = parseInt(speedSelect.value);
    };
    
    // ===== 初始化 =====
    updateUI();
})();
</script>
</body>
</html>
