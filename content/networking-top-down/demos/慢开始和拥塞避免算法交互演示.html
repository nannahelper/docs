<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCP拥塞控制演示</title>
    <style>
        /* ===== 408教学风格基础样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #1a56db;
            --primary-light: #e1effe;
            --success: #047857;
            --success-light: #d1fae5;
            --danger: #b91c1c;
            --danger-light: #fee2e2;
            --warning: #d97706;
            --warning-light: #fef3c7;
            --purple: #7c3aed;
            --purple-light: #ede9fe;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --border: #d1d5db;
            --bg-light: #f9fafb;
            --white: #ffffff;
        }
        
        body {
            font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--white);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
        }
        
        /* ===== 页面布局 ===== */
        .page {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }
        
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-light);
        }
        
        .page-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }
        
        .page-title code {
            font-family: "Consolas", "Monaco", monospace;
            background: var(--primary-light);
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 13px;
            margin-left: 8px;
        }
        
        .page-badge {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--white);
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 3px;
        }
        
        .page-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .main-panel {
            flex: 0 0 78%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }
        
        .side-panel {
            flex: 0 0 22%;
            display: flex;
            flex-direction: column;
            background: var(--bg-light);
        }
        
        /* ===== 图表区域 ===== */
        .chart-area {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .chart-stats {
            display: flex;
            gap: 20px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: "Consolas", "Monaco", monospace;
            font-size: 13px;
        }
        
        .stat-label {
            color: var(--text-secondary);
        }
        
        .stat-value {
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 3px;
            min-width: 40px;
            text-align: center;
        }
        
        .stat-value.cwnd {
            background: var(--primary-light);
            color: var(--primary);
        }
        
        .stat-value.ssthresh {
            background: var(--danger-light);
            color: var(--danger);
        }
        
        .stat-value.round {
            background: var(--bg-light);
            color: var(--text);
            border: 1px solid var(--border);
        }
        
        .phase-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .phase-indicator.slow-start {
            background: var(--success-light);
            color: var(--success);
        }
        
        .phase-indicator.congestion-avoidance {
            background: var(--warning-light);
            color: var(--warning);
        }
        
        .phase-indicator.fast-recovery {
            background: var(--purple-light);
            color: var(--purple);
        }
        
        .chart-container {
            flex: 1;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        
        .chart-svg {
            width: 100%;
            height: 100%;
        }
        
        /* 图表元素样式 */
        .axis-line {
            stroke: var(--text);
            stroke-width: 1.5;
        }
        
        .axis-arrow {
            fill: var(--text);
        }
        
        .grid-line {
            stroke: var(--border);
            stroke-width: 0.5;
            stroke-dasharray: 4,4;
        }
        
        .axis-label {
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 12px;
            fill: var(--text);
        }
        
        .axis-tick {
            font-family: "Consolas", "Monaco", monospace;
            font-size: 11px;
            fill: var(--text-secondary);
        }
        
        .data-line {
            fill: none;
            stroke: var(--text);
            stroke-width: 2;
        }
        
        .data-point {
            fill: var(--text);
        }
        
        .data-point.slow-start {
            fill: var(--success);
        }
        
        .data-point.congestion-avoidance {
            fill: var(--warning);
        }
        
        .data-point.timeout {
            fill: var(--danger);
        }
        
        .data-point.fast-recovery {
            fill: var(--purple);
        }
        
        .data-point.current {
            stroke: var(--primary);
            stroke-width: 2;
            fill: var(--white);
        }
        
        .ssthresh-line {
            stroke: var(--danger);
            stroke-width: 1.5;
            stroke-dasharray: 6,4;
        }
        
        .ssthresh-label {
            font-family: "Consolas", "Monaco", monospace;
            font-size: 11px;
            fill: var(--danger);
        }
        
        .phase-label {
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 11px;
            fill: var(--text-secondary);
        }
        
        .event-marker {
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 10px;
            fill: var(--danger);
        }
        
        /* ===== 控制面板 ===== */
        .control-area {
            border-top: 1px solid var(--border);
            padding: 12px 20px;
            background: var(--white);
        }
        
        .control-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        
        .control-left {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            align-items: center;
        }
        
        .control-right {
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: flex-end;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .control-label {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .btn {
            padding: 6px 16px;
            border: 1px solid transparent;
            border-radius: 3px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #1e40af;
        }
        
        .btn-success {
            background: var(--success);
            color: var(--white);
        }
        
        .btn-success:hover:not(:disabled) {
            background: #065f46;
        }
        
        .btn-secondary {
            background: var(--white);
            color: var(--text-secondary);
            border-color: var(--border);
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-light);
        }
        
        /* 场景按钮 */
        .btn-scenario {
            background: var(--white);
            color: var(--text-secondary);
            border-color: var(--border);
            padding: 6px 12px;
        }
        
        .btn-scenario.active {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }
        
        .btn-scenario:hover:not(.active):not(:disabled) {
            background: var(--bg-light);
        }
        
        /* 速度按钮 */
        .speed-group {
            display: flex;
            border: 1px solid var(--border);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .btn-speed {
            padding: 5px 12px;
            border: none;
            background: var(--white);
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            border-right: 1px solid var(--border);
        }
        
        .btn-speed:last-child {
            border-right: none;
        }
        
        .btn-speed.active {
            background: var(--primary);
            color: var(--white);
        }
        
        .btn-speed:hover:not(.active) {
            background: var(--bg-light);
        }
        
        .action-hint {
            font-size: 12px;
            color: var(--danger);
            font-weight: 600;
            animation: hintBlink 1s ease-in-out infinite;
            margin-right: 4px;
        }
        
        @keyframes hintBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* ===== 右侧面板 ===== */
        .side-header {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            background: var(--white);
        }
        
        .scenario-desc {
            padding: 10px 12px;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        
        .scenario-desc strong {
            color: var(--text);
            display: block;
            margin-bottom: 4px;
        }
        
        .steps-list {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px 10px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 3px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .step-item.slow-start {
            border-left: 3px solid var(--success);
        }
        
        .step-item.congestion-avoidance {
            border-left: 3px solid var(--warning);
        }
        
        .step-item.timeout {
            border-left: 3px solid var(--danger);
        }
        
        .step-item.fast-recovery {
            border-left: 3px solid var(--purple);
        }
        
        .step-num {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--border);
            color: var(--white);
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .step-item.slow-start .step-num {
            background: var(--success);
        }
        
        .step-item.congestion-avoidance .step-num {
            background: var(--warning);
        }
        
        .step-item.timeout .step-num {
            background: var(--danger);
        }
        
        .step-item.fast-recovery .step-num {
            background: var(--purple);
        }
        
        .step-text {
            flex: 1;
            line-height: 1.4;
        }
        
        .step-text code {
            font-family: "Consolas", "Monaco", monospace;
            background: rgba(0,0,0,0.05);
            padding: 1px 4px;
            border-radius: 2px;
        }
        
        /* 图例面板 */
        .legend-panel {
            padding: 12px;
            border-top: 1px solid var(--border);
            background: var(--white);
        }
        
        .legend-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }
        
        .legend-items {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        
        .legend-dot.slow-start {
            background: var(--success);
        }
        
        .legend-dot.congestion-avoidance {
            background: var(--warning);
        }
        
        .legend-dot.timeout {
            background: var(--danger);
        }
        
        .legend-dot.fast-recovery {
            background: var(--purple);
        }
        
        .legend-line {
            width: 20px;
            height: 0;
            border-top: 2px dashed var(--danger);
        }
        
        /* 提示框样式 */
        .tip-box {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 44px;
        }
        
        .tip-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }
        
        .tip-icon.slow-start {
            background: var(--success-light);
            color: var(--success);
        }
        
        .tip-icon.congestion-avoidance {
            background: var(--warning-light);
            color: var(--warning);
        }
        
        .tip-icon.timeout {
            background: var(--danger-light);
            color: var(--danger);
        }
        
        .tip-icon.fast-recovery {
            background: var(--purple-light);
            color: var(--purple);
        }
        
        .tip-icon.init {
            background: var(--primary-light);
            color: var(--primary);
        }
        
        .tip-icon.end {
            background: var(--success-light);
            color: var(--success);
        }
        
        .tip-content {
            flex: 1;
        }
        
        .tip-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 2px;
        }
        
        .tip-desc {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.4;
        }
        
        .tip-box.highlight {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        
        .tip-box.highlight .tip-title {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- 顶部标题栏 -->
        <header class="page-header">
            <h1 class="page-title">TCP拥塞控制<code>Congestion Control</code></h1>
            <span class="page-badge">计算机网络 · 传输层</span>
        </header>
        
        <!-- 主体区域 -->
        <div class="page-body">
            <!-- 左侧主面板 -->
            <div class="main-panel">
                <!-- 图表区域 -->
                <div class="chart-area">
                    <div class="chart-header">
                        <div class="chart-stats">
                            <div class="stat-item">
                                <span class="stat-label">传输轮次:</span>
                                <span class="stat-value round" id="roundValue">0</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">cwnd:</span>
                                <span class="stat-value cwnd" id="cwndValue">1</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">ssthresh:</span>
                                <span class="stat-value ssthresh" id="ssthreshValue">16</span>
                            </div>
                        </div>
                        <div class="phase-indicator slow-start" id="phaseIndicator">
                            <span>● 慢开始阶段</span>
                        </div>
                    </div>
                    <!-- 提示框 -->
                    <div class="tip-box" id="tipBox">
                        <div class="tip-icon init" id="tipIcon">!</div>
                        <div class="tip-content">
                            <div class="tip-title" id="tipTitle">点击"开始演示"</div>
                            <div class="tip-desc" id="tipDesc">选择场景后开始观察TCP拥塞控制的工作过程</div>
                        </div>
                    </div>
                    <div class="chart-container">
                        <svg class="chart-svg" id="chartSvg"></svg>
                    </div>
                </div>
                
                <!-- 控制面板 -->
                <div class="control-area">
                    <div class="control-row">
                        <div class="control-left">
                            <div class="control-group">
                                <span class="control-label">选择场景:</span>
                                <button class="btn btn-scenario active" id="btnScene1">基本流程</button>
                                <button class="btn btn-scenario" id="btnScene2">快恢复</button>
                                <button class="btn btn-scenario" id="btnScene3">多次拥塞</button>
                            </div>
                            <div class="control-group">
                                <span class="control-label">速度:</span>
                                <div class="speed-group">
                                    <button class="btn-speed" id="speedFast">快</button>
                                    <button class="btn-speed active" id="speedMedium">中</button>
                                    <button class="btn-speed" id="speedSlow">慢</button>
                                </div>
                            </div>
                        </div>
                        <div class="control-right">
                            <span class="action-hint" id="hintStart">请选择 ▶</span>
                            <button class="btn btn-primary" id="btnStart">开始演示</button>
                            <span class="action-hint" id="hintNext" style="display:none;">请选择 ▶</span>
                            <button class="btn btn-success" id="btnNext" disabled>单步执行</button>
                            <button class="btn btn-success" id="btnAuto" disabled>自动演示</button>
                            <button class="btn btn-secondary" id="btnReset">重置</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧消息面板 -->
            <div class="side-panel">
                <div class="side-header">场景说明</div>
                <div class="scenario-desc" id="scenarioDesc">
                    <strong>场景1：基本流程</strong>
                    演示TCP拥塞控制的完整流程：慢开始的指数增长、拥塞避免的线性增长、超时后的"乘法减小"处理。
                </div>
                <div class="side-header">执行步骤</div>
                <div class="steps-list" id="stepsList"></div>
                
                <!-- 图例 -->
                <div class="legend-panel">
                    <div class="legend-title">图例说明</div>
                    <div class="legend-items">
                        <div class="legend-item">
                            <span class="legend-dot slow-start"></span>
                            <span>慢开始: cwnd 指数增长</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-dot congestion-avoidance"></span>
                            <span>拥塞避免: cwnd 线性增长</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-dot timeout"></span>
                            <span>超时: cwnd 重置为1</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-dot fast-recovery"></span>
                            <span>快恢复: cwnd 减半</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-line"></span>
                            <span>ssthresh 阈值线</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
    (function() {
        // ===== 场景配置 =====
        var SCENARIOS = {
            scene1: {
                name: '基本流程',
                desc: '<strong>场景1：基本流程（TCP Tahoe）</strong>演示TCP拥塞控制的完整流程：慢开始的指数增长、拥塞避免的线性增长、超时后"乘法减小"处理（ssthresh减半，cwnd重置为1）。',
                ssthresh: 16,
                steps: [
                    { type: 'init', cwnd: 1, ssthresh: 16, log: '初始化: cwnd=1, ssthresh=16', 
                      tip: '开始发送', tipDesc: '刚建立连接，不清楚网络状况，先用小窗口试探' },
                    { type: 'slow-start', cwnd: 2, log: '慢开始: cwnd=1×2=2',
                      tip: '指数增长', tipDesc: '每收到一个ACK，cwnd翻倍，快速探测网络容量' },
                    { type: 'slow-start', cwnd: 4, log: '慢开始: cwnd=2×2=4',
                      tip: '窗口翻倍', tipDesc: '网络畅通，继续加大发送量' },
                    { type: 'slow-start', cwnd: 8, log: '慢开始: cwnd=4×2=8',
                      tip: '快速增长', tipDesc: '慢开始其实"不慢"，cwnd呈指数级增长' },
                    { type: 'slow-start', cwnd: 16, log: '慢开始: cwnd=8×2=16，达到ssthresh',
                      tip: '到达阈值!', tipDesc: 'cwnd达到ssthresh，即将进入拥塞避免阶段' },
                    { type: 'congestion-avoidance', cwnd: 17, log: '拥塞避免: cwnd=16+1=17',
                      tip: '线性增长', tipDesc: '接近网络容量极限，改为每轮+1，小心试探' },
                    { type: 'congestion-avoidance', cwnd: 18, log: '拥塞避免: cwnd=17+1=18',
                      tip: '谨慎前进', tipDesc: '加法增大(AI)：每个RTT只增加1个MSS' },
                    { type: 'congestion-avoidance', cwnd: 19, log: '拥塞避免: cwnd=18+1=19',
                      tip: '逐步增加', tipDesc: '线性增长速度慢，但更安全' },
                    { type: 'congestion-avoidance', cwnd: 20, log: '拥塞避免: cwnd=19+1=20',
                      tip: '平稳增长', tipDesc: '在网络容量边界附近小心试探' },

        // ===== 更新提示框 =====
        function updateTip(step) {
            if (!step) {
                tipIcon.className = 'tip-icon init';
                tipIcon.textContent = '!';
                tipTitle.textContent = '点击"开始演示"';
                tipDesc.textContent = '选择场景后开始观察TCP拥塞控制的工作过程';
                tipBox.classList.remove('highlight');
                return;
            }
            
            var iconMap = {
                'init': '!',
                'slow-start': '▲',
                'congestion-avoidance': '→',
                'timeout': '×',
                'fast-recovery': '↓',
                'end': '✓'
            };
            
            tipIcon.className = 'tip-icon ' + step.type;
            tipIcon.textContent = iconMap[step.type] || '!';
            tipTitle.textContent = step.tip || '';
            tipDesc.textContent = step.tipDesc || '';
            
            // 关键节点高亮
            if (step.type === 'timeout' || step.type === 'fast-recovery' || step.type === 'end') {
                tipBox.classList.add('highlight');
            } else {
                tipBox.classList.remove('highlight');
            }
        }
        
        // ===== 图表尺寸计算 =====
        var chartWidth, chartHeight, plotWidth, plotHeight;
        var scaleX, scaleY;
        
        function updateChartSize() {
            var rect = chartSvg.getBoundingClientRect();
            chartWidth = rect.width || 800;
            chartHeight = rect.height || 400;
            plotWidth = chartWidth - CONFIG.padding.left - CONFIG.padding.right;
            plotHeight = chartHeight - CONFIG.padding.top - CONFIG.padding.bottom;
            
            scaleX = plotWidth / CONFIG.maxRounds;
            scaleY = plotHeight / CONFIG.maxCwnd;
        }
        
        function toChartX(round) {
            return CONFIG.padding.left + round * scaleX;
        }
        
        function toChartY(cwnd) {
            return chartHeight - CONFIG.padding.bottom - cwnd * scaleY;
        }
        
        // ===== 绘制图表 =====
        function renderChart() {
            updateChartSize();
            
            var html = '';
            
            // 绘制网格线
            for (var i = 0; i <= CONFIG.maxCwnd; i += 4) {
                var y = toChartY(i);
                html += '<line class="grid-line" x1="' + CONFIG.padding.left + '" y1="' + y + '" x2="' + (chartWidth - CONFIG.padding.right) + '" y2="' + y + '"/>';
            }
            
            for (var i = 0; i <= CONFIG.maxRounds; i += 2) {
                var x = toChartX(i);
                html += '<line class="grid-line" x1="' + x + '" y1="' + CONFIG.padding.top + '" x2="' + x + '" y2="' + (chartHeight - CONFIG.padding.bottom) + '"/>';
            }
            
            // 绘制坐标轴
            html += '<line class="axis-line" x1="' + CONFIG.padding.left + '" y1="' + CONFIG.padding.top + '" x2="' + CONFIG.padding.left + '" y2="' + (chartHeight - CONFIG.padding.bottom) + '"/>';
            html += '<polygon class="axis-arrow" points="' + CONFIG.padding.left + ',' + (CONFIG.padding.top - 8) + ' ' + (CONFIG.padding.left - 5) + ',' + (CONFIG.padding.top + 2) + ' ' + (CONFIG.padding.left + 5) + ',' + (CONFIG.padding.top + 2) + '"/>';
            
            html += '<line class="axis-line" x1="' + CONFIG.padding.left + '" y1="' + (chartHeight - CONFIG.padding.bottom) + '" x2="' + (chartWidth - CONFIG.padding.right) + '" y2="' + (chartHeight - CONFIG.padding.bottom) + '"/>';
            html += '<polygon class="axis-arrow" points="' + (chartWidth - CONFIG.padding.right + 8) + ',' + (chartHeight - CONFIG.padding.bottom) + ' ' + (chartWidth - CONFIG.padding.right - 2) + ',' + (chartHeight - CONFIG.padding.bottom - 5) + ' ' + (chartWidth - CONFIG.padding.right - 2) + ',' + (chartHeight - CONFIG.padding.bottom + 5) + '"/>';
            
            // 坐标轴标签
            html += '<text class="axis-label" x="' + (CONFIG.padding.left - 10) + '" y="' + (CONFIG.padding.top - 20) + '" text-anchor="middle">拥塞窗口cwnd</text>';
            html += '<text class="axis-label" x="' + (chartWidth - CONFIG.padding.right + 20) + '" y="' + (chartHeight - CONFIG.padding.bottom + 25) + '" text-anchor="middle">传输轮次</text>';
            
            // Y轴刻度
            for (var i = 0; i <= CONFIG.maxCwnd; i += 4) {
                var y = toChartY(i);
                html += '<text class="axis-tick" x="' + (CONFIG.padding.left - 10) + '" y="' + (y + 4) + '" text-anchor="end">' + i + '</text>';
            }
            
            // X轴刻度
            for (var i = 0; i <= CONFIG.maxRounds; i += 2) {
                var x = toChartX(i);
                html += '<text class="axis-tick" x="' + x + '" y="' + (chartHeight - CONFIG.padding.bottom + 18) + '" text-anchor="middle">' + i + '</text>';
            }
            
            // 绘制ssthresh线
            html += renderSsthreshLines();
            
            // 绘制数据线和点
            html += renderDataLine();
            
            chartSvg.innerHTML = html;
        }
        
        function renderSsthreshLines() {
            var html = '';
            
            if (state.ssthreshHistory.length === 0) {
                var y = toChartY(state.ssthresh);
                html += '<line class="ssthresh-line" x1="' + CONFIG.padding.left + '" y1="' + y + '" x2="' + (chartWidth - CONFIG.padding.right) + '" y2="' + y + '"/>';
                html += '<text class="ssthresh-label" x="' + (chartWidth - CONFIG.padding.right + 5) + '" y="' + (y + 4) + '">ssthresh=' + state.ssthresh + '</text>';
            } else {
                for (var i = 0; i < state.ssthreshHistory.length; i++) {
                    var sh = state.ssthreshHistory[i];
                    var nextSh = state.ssthreshHistory[i + 1];
                    var y = toChartY(sh.value);
                    var startX = toChartX(sh.round);
                    var endX = nextSh ? toChartX(nextSh.round) : (chartWidth - CONFIG.padding.right);
                    
                    html += '<line class="ssthresh-line" x1="' + startX + '" y1="' + y + '" x2="' + endX + '" y2="' + y + '"/>';
                    
                    if (i === state.ssthreshHistory.length - 1) {
                        html += '<text class="ssthresh-label" x="' + (endX + 5) + '" y="' + (y + 4) + '">ssthresh=' + sh.value + '</text>';
                    } else {
                        html += '<text class="ssthresh-label" x="' + (startX + 5) + '" y="' + (y - 5) + '" font-size="10">' + sh.value + '</text>';
                    }
                }
            }
            
            return html;
        }
        
        function renderDataLine() {
            var html = '';
            
            if (state.history.length === 0) return html;
            
            // 绘制连接线
            var pathData = 'M ' + toChartX(0) + ' ' + toChartY(state.history[0].cwnd);
            for (var i = 1; i < state.history.length; i++) {
                var prev = state.history[i - 1];
                var curr = state.history[i];
                
                if (curr.type === 'timeout' || curr.type === 'fast-recovery') {
                    // 垂直下降
                    pathData += ' L ' + toChartX(i - 1) + ' ' + toChartY(curr.cwnd);
                    pathData += ' L ' + toChartX(i) + ' ' + toChartY(curr.cwnd);
                } else {
                    pathData += ' L ' + toChartX(i) + ' ' + toChartY(curr.cwnd);
                }
            }
            
            html += '<path class="data-line" d="' + pathData + '"/>';
            
            // 绘制数据点
            for (var i = 0; i < state.history.length; i++) {
                var point = state.history[i];
                var x = toChartX(i);
                var y = toChartY(point.cwnd);
                var isCurrent = (i === state.history.length - 1);
                var radius = isCurrent ? CONFIG.currentPointRadius : CONFIG.pointRadius;
                var typeClass = point.type === 'init' ? 'slow-start' : point.type;
                var currentClass = isCurrent ? ' current' : '';
                
                html += '<circle class="data-point ' + typeClass + currentClass + '" cx="' + x + '" cy="' + y + '" r="' + radius + '"/>';
                
                // 标记拥塞事件
                if (point.type === 'timeout') {
                    html += '<text class="event-marker" x="' + x + '" y="' + (y - 15) + '" text-anchor="middle">超时</text>';
                } else if (point.type === 'fast-recovery') {
                    html += '<text class="event-marker" x="' + x + '" y="' + (y - 15) + '" text-anchor="middle" fill="#7c3aed">快恢复</text>';
                }
            }
            
            return html;
        }
        
        // ===== 更新UI =====
        function updateUI() {
            var scene = SCENARIOS[state.currentScene];
            var currentStep = state.stepIndex > 0 ? scene.steps[state.stepIndex - 1] : scene.steps[0];
            
            roundValue.textContent = Math.max(0, state.stepIndex - 1);
            cwndValue.textContent = state.cwnd;
            ssthreshValue.textContent = state.ssthresh;
            
            // 更新阶段指示器
            var phaseType = currentStep ? currentStep.type : 'slow-start';
            if (phaseType === 'init' || phaseType === 'end') phaseType = 'slow-start';
            
            phaseIndicator.className = 'phase-indicator ' + phaseType;
            var phaseNames = {
                'slow-start': '● 慢开始阶段',
                'congestion-avoidance': '● 拥塞避免阶段',
                'timeout': '● 超时重传',
                'fast-recovery': '● 快恢复阶段'
            };
            phaseIndicator.innerHTML = '<span>' + (phaseNames[phaseType] || '● 慢开始阶段') + '</span>';
            
            // 更新按钮状态
            var isRunning = state.phase === 'running';
            var isComplete = state.stepIndex >= scene.steps.length;
            
            btnScene1.disabled = isRunning;
            btnScene2.disabled = isRunning;
            btnScene3.disabled = isRunning;
            btnStart.disabled = isRunning;
            btnNext.disabled = !isRunning || isComplete || state.autoMode;
            btnAuto.disabled = !isRunning || isComplete;
            
            // 更新提示
            hintStart.style.display = state.phase === 'idle' ? 'inline' : 'none';
            hintNext.style.display = isRunning && !isComplete && !state.autoMode ? 'inline' : 'none';
            
            btnAuto.textContent = state.autoMode ? '停止' : '自动演示';
        }
        
        // ===== 添加步骤日志 =====
        function addStep(text, type) {
            state.stepCount++;
            var stepItem = document.createElement('div');
            stepItem.className = 'step-item ' + (type || '');
            stepItem.innerHTML = '<span class="step-num">' + state.stepCount + '</span>' +
                                 '<span class="step-text">' + text + '</span>';
            
            if (stepsList.firstChild) {
                stepsList.insertBefore(stepItem, stepsList.firstChild);
            } else {
                stepsList.appendChild(stepItem);
            }
            stepsList.scrollTop = 0;
        }
        
        // ===== 执行步骤 =====
        function executeStep() {
            var scene = SCENARIOS[state.currentScene];
            if (state.stepIndex >= scene.steps.length) {
                state.autoMode = false;
                updateUI();
                return;
            }
            
            var step = scene.steps[state.stepIndex];
            
            // 更新状态
            state.cwnd = step.cwnd;
            if (step.ssthresh !== undefined) {
                state.ssthresh = step.ssthresh;
            }
            
            // 记录历史
            if (step.type !== 'end') {
                state.history.push({
                    cwnd: step.cwnd,
                    type: step.type
                });
                
                // 记录ssthresh变化
                if (step.type === 'timeout' || step.type === 'fast-recovery' || step.type === 'init') {
                    state.ssthreshHistory.push({
                        round: state.stepIndex,
                        value: step.ssthresh
                    });
                }
            }
            
            // 添加日志
            addStep(step.log, step.type);
            
            // 更新提示框
            updateTip(step);
            
            state.stepIndex++;
            renderChart();
            updateUI();
        }
        
        // ===== 选择场景 =====
        function selectScene(sceneId) {
            state.currentScene = sceneId;
            var scene = SCENARIOS[sceneId];
            
            // 更新按钮样式
            btnScene1.classList.toggle('active', sceneId === 'scene1');
            btnScene2.classList.toggle('active', sceneId === 'scene2');
            btnScene3.classList.toggle('active', sceneId === 'scene3');
            
            // 更新场景说明
            scenarioDesc.innerHTML = scene.desc;
            
            // 更新CONFIG
            if (sceneId === 'scene3') {
                CONFIG.maxCwnd = 36;
            } else {
                CONFIG.maxCwnd = 28;
            }
            
            resetDemo();
        }
        
        // ===== 开始演示 =====
        function startDemo() {
            var scene = SCENARIOS[state.currentScene];
            
            state.phase = 'running';
            state.stepIndex = 0;
            state.cwnd = 1;
            state.ssthresh = scene.ssthresh;
            state.history = [];
            state.ssthreshHistory = [];
            state.stepCount = 0;
            state.autoMode = false;
            
            stepsList.innerHTML = '';
            renderChart();
            updateUI();
        }
        
        // ===== 自动演示 =====
        function toggleAuto() {
            state.autoMode = !state.autoMode;
            updateUI();
            
            if (state.autoMode) {
                runAuto();
            }
        }
        
        function runAuto() {
            if (!state.autoMode || state.phase !== 'running') {
                state.autoMode = false;
                updateUI();
                return;
            }
            
            var scene = SCENARIOS[state.currentScene];
            if (state.stepIndex >= scene.steps.length) {
                state.autoMode = false;
                updateUI();
                return;
            }
            
            executeStep();
            setTimeout(runAuto, state.speed);
        }
        
        // ===== 重置 =====
        function resetDemo() {
            var scene = SCENARIOS[state.currentScene];
            
            state.phase = 'idle';
            state.stepIndex = 0;
            state.cwnd = 1;
            state.ssthresh = scene.ssthresh;
            state.history = [];
            state.ssthreshHistory = [];
            state.autoMode = false;
            state.stepCount = 0;
            
            stepsList.innerHTML = '';
            updateTip(null);
            renderChart();
            updateUI();
        }
        
        // ===== 速度选择 =====
        function setSpeed(speed) {
            state.speed = SPEEDS[speed];
            speedFast.classList.toggle('active', speed === 'fast');
            speedMedium.classList.toggle('active', speed === 'medium');
            speedSlow.classList.toggle('active', speed === 'slow');
        }
        
        // ===== 事件绑定 =====
        btnScene1.onclick = function() { selectScene('scene1'); };
        btnScene2.onclick = function() { selectScene('scene2'); };
        btnScene3.onclick = function() { selectScene('scene3'); };
        btnStart.onclick = startDemo;
        btnNext.onclick = executeStep;
        btnAuto.onclick = toggleAuto;
        btnReset.onclick = resetDemo;
        
        speedFast.onclick = function() { setSpeed('fast'); };
        speedMedium.onclick = function() { setSpeed('medium'); };
        speedSlow.onclick = function() { setSpeed('slow'); };
        
        window.onresize = function() {
            renderChart();
        };
        
        // ===== 初始化 =====
        setTimeout(function() {
            renderChart();
            updateUI();
        }, 100);
    })();
    </script>
</body>
</html>
